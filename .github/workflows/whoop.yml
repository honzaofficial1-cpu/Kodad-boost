name: WHOOP worker
on:
  workflow_dispatch:
  push:
    paths: ['whoop/**', '.github/workflows/whoop.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Kontrola tajných údajů
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          I: ${{ secrets.WHOOP_CLIENT_ID }}
          S: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          miss=""; [ -z "$T" ] && miss="$miss CLOUDFLARE_API_TOKEN"; [ -z "$A" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"; [ -z "$I" ] && miss="$miss WHOOP_CLIENT_ID"; [ -z "$S" ] && miss="$miss WHOOP_CLIENT_SECRET"
          if [ -n "$miss" ]; then echo "::notice::Zatím chybí GitHub secrets:$miss – nasazení přeskočeno"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: KV úložiště
        if: steps.chk.outputs.skip != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          V=$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "::notice::Token: $(echo "$V" | jq -c '{success,status:.result.status,errors:[.errors[]?.message]}')"
          ACC=$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A")
          echo "::notice::Účet: $(echo "$ACC" | jq -c '{success,name:.result.name,errors:[.errors[]?.message]}')"
          API="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces"
          L=$(curl -s -H "Authorization: Bearer $T" "$API?per_page=100"); echo "::notice::KV seznam: $(echo "$L" | jq -c '{success,count:(.result|length?),errors:[.errors[]?|"\(.code) \(.message)"]}')"
          ID=$(echo "$L" | jq -r '.result[]? | select(.title=="kodad-whoop") | .id' | head -1)
          ID=${ID:-$(echo "$L" | jq -r '.result[]? | select(.title=="kodad-whoop-KV") | .id' | head -1)}
          if [ -z "$ID" ]; then
            printf '{"title":"kodad-whoop"}' > /tmp/kv.json
            R=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @/tmp/kv.json "$API"); echo "::notice::KV vytvoření (API): $(echo "$R" | jq -c '{success,errors:[.errors[]?|"\(.code) \(.message)"]}')"
            ID=$(echo "$R" | jq -r '.result.id // empty')
          fi
          if [ -z "$ID" ]; then
            sed -i "s/__ACC__/$A/" whoop/wrangler.toml; sed -i '/\[\[kv_namespaces\]\]/,$d' whoop/wrangler.toml
            OUT=$(cd whoop && CLOUDFLARE_API_TOKEN=$T CLOUDFLARE_ACCOUNT_ID=$A npx -y wrangler@3.99.0 kv namespace create KV 2>&1); echo "$OUT" | tail -5
            ID=$(echo "$OUT" | grep -oE 'id"? ?[=:] ?"[0-9a-f]{32}"' | grep -oE '[0-9a-f]{32}' | head -1)
            git checkout whoop/wrangler.toml
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "::error::KV se nepodařilo vytvořit – zkontroluj oprávnění API tokenu"; exit 1; fi
          sed -i "s/__KV_ID__/$ID/; s/__ACC__/$A/" whoop/wrangler.toml
          echo "::notice::KV $ID"
      - name: Nasazení
        if: steps.chk.outputs.skip != '1'
        working-directory: whoop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          npx -y wrangler@3.99.0 deploy
          printf '%s' "$WHOOP_CLIENT_ID" | npx -y wrangler@3.99.0 secret put WHOOP_CLIENT_ID
          printf '%s' "$WHOOP_CLIENT_SECRET" | npx -y wrangler@3.99.0 secret put WHOOP_CLIENT_SECRET
          echo "::notice::Hotovo – worker běží"
