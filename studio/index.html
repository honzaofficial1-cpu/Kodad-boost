<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="theme-color" content="#F5F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 600 800; font-stretch: 100%; font-display: swap; src: url(fonts/bricolage-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 600 800; font-stretch: 100%; font-display: swap; src: url(fonts/bricolage-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family: 'Geist'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/geist-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family: 'Geist'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/geist-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
:root{
  --bg:#F5F4F1;--surf:#FFFFFF;--sunk:#ECEAE5;--line:#E6E3DD;--line2:#D6D2CA;
  --ink:#16161A;--tx2:#5E5F67;--tx3:#9B9BA2;
  --brand:#F26A1B;--brand-ink:#C24E0E;--brand-soft:#FFF0E5;
  --bad:#C2362B;
  --pub:#1F9D57;--pub-soft:#E2F4E9;--pub-ink:#157444;
  --fd:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --fb:'Geist',ui-sans-serif,-apple-system,system-ui,sans-serif;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
body{min-height:100dvh;padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand-ink)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:calc(160px + var(--safe-b))}

/* hlavička */
.top{position:sticky;top:0;z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;stroke:none}
.top h1{font:800 32px/1 var(--fd);letter-spacing:-.03em;margin:0;flex:1}
#topx{display:flex;gap:6px}

/* spodní lišta */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .wrap{display:flex;padding:0 4px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:500;color:var(--tx3)}
.tabs button svg{width:23px;height:23px;stroke-width:1.8}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{color:var(--brand);stroke-width:2.2}

/* typografie */
h2{font:700 13px/1.2 var(--fb);letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin:28px 2px 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{color:var(--tx3);font-weight:500;letter-spacing:0}
.muted{color:var(--tx3);font-size:14.5px;margin:4px 2px 10px}
.hint{display:block;color:var(--tx3);font-size:13.5px;margin:6px 2px 0;text-decoration:none}
a.hint{color:var(--brand-ink)}
.hit{color:var(--brand)!important}
.late{color:var(--bad)}
.l{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:16px 2px 6px}
.date{font:700 24px/1.15 var(--fd);letter-spacing:-.02em;margin:2px 2px 16px;color:var(--ink)}

/* tlačítka */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:99px;background:var(--surf);border:1px solid var(--line2);font-size:15px;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.sm{height:34px;padding:0 13px;font-size:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.full{width:100%}
.btn.big{height:52px;font-size:16.5px}
.btn.big svg{width:20px;height:20px;stroke-width:2.6}
.btn.quiet{background:none;border-color:transparent;color:var(--tx2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.btn svg{width:17px;height:17px}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:99px;color:var(--ink)}
.ico:active{background:var(--sunk)}
.ico.sm{width:30px;height:30px;color:var(--tx3)}
.ico.sm svg{width:16px;height:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1}
.btnrow.end .btn{flex:none}
.btnrow .sp{flex:1}
.btnrow input{flex:1;min-width:0}

/* formuláře */
input,textarea,select{width:100%;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:none;line-height:1.45;display:block}
input::placeholder,textarea::placeholder{color:var(--tx3)}
.modal input+input,.modal input+textarea,.modal textarea+input{margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.g2 input{margin:0!important}

/* seznamy */
.list{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.list>.row:first-child,.list>:first-child{border-top:0}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .rt small{display:block;color:var(--tx3);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt span{display:block}
.row .btns{display:flex;gap:6px;flex:none}
.row[data-open],.row[data-pick],.row[data-rb]{cursor:pointer}
.row .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--tx3);margin-bottom:1px}
.row.k-late .lbl{color:var(--bad)}
.row.k-pub .lbl,.row .lbl:not(.s):not(.t){}
.row.k-pub .lbl,.row .lbl.p{color:var(--pub-ink)}
.row.k-shoot .lbl,.row .lbl.s{color:var(--tx2)}
.row .lbl.t{color:var(--ink)}
.row.isdone .rt b{color:var(--tx3);text-decoration:line-through}
.row.add{padding:4px 6px}
.row.add input{border:0;padding:10px 8px}
.row.task{gap:10px}
.row.task .rt span{font-size:16px}
.tick{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.tick svg{width:15px;height:15px;stroke-width:3}
.row.task.done .tick{background:var(--brand);border-color:var(--brand);color:#fff}
.row.task.done .rt span{color:var(--tx3);text-decoration:line-through}
.okm{color:var(--brand);display:grid;place-items:center;width:34px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line2)}
.dot.s-idea{background:var(--line2)}
.dot.s-script{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.dot.s-shot{background:none;box-shadow:inset 0 0 0 2.5px var(--brand)}
.dot.s-done{background:var(--brand)}
h2 .dot{width:8px;height:8px}
.num{text-align:right;flex:none}
.num b{display:block;font:800 21px/1.05 var(--fd);letter-spacing:-.02em}
.num small{display:block;color:var(--tx3);font-size:12px;margin-top:2px}

/* dnes */
.term{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;margin-bottom:12px}
.term b{font:700 18px/1.2 var(--fd);flex:1}
.term span{color:#FFB98F;font-weight:600;font-size:15px}
.shootday{display:flex;align-items:center;width:100%;text-align:left;gap:10px;padding:13px 14px;border-radius:var(--r);background:var(--brand-soft);border:1px solid #F8CFB3;margin-bottom:12px;color:var(--brand-ink)}
.shootday span{flex:1}.shootday b{display:block;font:700 18px/1.2 var(--fd)}.shootday small{color:var(--brand-ink);opacity:.8;font-size:13.5px}
.calm{padding:26px 16px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
.calm b{display:block;font:700 20px/1.2 var(--fd);margin-bottom:4px}
.calm span{color:var(--tx3);font-size:14.5px}
.quick{margin-top:20px}
.quick.top{margin:0 0 12px}
.quick input{height:50px;border-radius:99px;padding:0 20px;background:var(--surf)}

/* týden */
.wknav{display:flex;align-items:center;gap:6px;margin:0 -6px 10px}
.wknav b{flex:1;font:700 20px/1.2 var(--fd);letter-spacing:-.01em;padding-left:2px}
.modal .wknav b{font-size:17px}
.counter{padding:2px 2px 14px}
.counter .big{display:flex;align-items:baseline;gap:8px}
.counter .big b{font:800 48px/1 var(--fd);letter-spacing:-.04em}
.counter .big span{color:var(--tx2);font-size:15px}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cchips span{font-size:13.5px;padding:5px 11px;border-radius:99px;background:var(--surf);border:1px solid var(--line);color:var(--tx2)}
.cchips span b{color:var(--ink);font-weight:700}
.cchips span.full{background:var(--brand-soft);border-color:#F8CFB3;color:var(--brand-ink)}
.cchips span.full b{color:var(--brand-ink)}
.seg{display:flex;background:var(--sunk);border-radius:99px;padding:3px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:99px;font-size:14.5px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pool{margin-bottom:14px}
.pool small{display:block;color:var(--tx3);font-size:13px;margin:0 2px 6px}
.pool div{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.pool div::-webkit-scrollbar{display:none}
.pchip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--surf);border:1px dashed var(--line2);font-size:14px;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wlist{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wd{padding:12px 14px 10px;border-top:1px solid var(--line)}
.wd:first-child{border-top:0}
.wd.tod{background:#FFFAF6}
.wd.past{opacity:.6}
.wdh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-bottom:6px}
.wdh b{font:700 17px/1.2 var(--fd)}
.wd.tod .wdh b{color:var(--brand)}
.wdh span{color:var(--tx3);font-size:13.5px}
.wdh em{font-style:normal;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:1px 7px;border-radius:99px}
.wdh i{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--ink);padding:1px 7px;border-radius:99px}
.slot{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
.sl{width:58px;flex:none;font-size:12.5px;font-weight:600;color:var(--tx3);padding-top:8px}
.sv{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.vchip{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:5px 4px 5px 11px;border-radius:99px;background:var(--sunk);font-size:14px;font-weight:500;cursor:pointer}
.vchip>button{display:grid;place-items:center;width:22px;height:22px;color:var(--tx3)}
.vchip>button svg{width:13px;height:13px}
.vchip.k-date{--cc:var(--pub);background:color-mix(in srgb,var(--cc) 15%,#fff);color:color-mix(in srgb,var(--cc) 72%,#000)}
.vchip.k-date.s-done{background:var(--cc);color:#fff}
.vchip.k-date.s-done>button{color:#ffffffb0}
.vchip.k-shoot{background:var(--sunk);color:var(--tx2)}
.vchip.k-shoot.s-shot,.vchip.k-shoot.s-done{text-decoration:line-through;color:var(--tx3)}
.row.day .rt .vchip{padding-right:11px;margin:2px 4px 2px 0}
.slin{flex:1;min-width:90px;border:0;background:none;padding:6px 4px;font-size:15px;border-radius:8px}
.slin.act,.slin:focus{background:var(--brand-soft)}
.row.day{align-items:flex-start}
.row.day .dl{width:34px;flex:none;padding-top:3px}
.row.day .dl b{display:block;font:700 16px/1.1 var(--fd)}
.row.day .dl small{color:var(--tx3);font-size:12.5px}
.row.day.tod .dl b{color:var(--brand)}
.row.day .rt{display:flex;flex-wrap:wrap;align-items:center}
.row.day .rt>small{color:var(--tx3)}
.tchip{font-size:12.5px;font-weight:600;color:#fff;background:var(--ink);padding:3px 9px;border-radius:99px;margin:2px 4px 2px 0}
.shline{display:block;width:100%;text-align:left;font-size:13.5px;color:var(--tx2);padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.claude{display:flex;gap:8px;margin-top:22px}
.claude .btn{flex:1}

/* kalendář */
.mgrid{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.mhead span{text-align:center;font-size:12px;font-weight:600;color:var(--tx3);padding:7px 0}
.mcells{display:grid;grid-template-columns:repeat(7,1fr)}
.mc{min-height:76px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;overflow:hidden}
.mc:nth-child(7n){border-right:0}
.mc .dn_{font-size:13px;font-weight:600;padding:1px 3px;align-self:flex-start;border-radius:6px}
.mc.out{background:#FAF9F7}
.mc.out .dn_{color:var(--tx3)}
.mc.today .dn_{background:var(--brand);color:#fff}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.c{display:block;font-size:10.5px;line-height:1.25;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.k-pub{--cc:var(--pub);background:color-mix(in srgb,var(--cc) 16%,#fff);color:color-mix(in srgb,var(--cc) 72%,#000);box-shadow:inset 2px 0 0 var(--cc)}
.c.k-pub.dn{background:var(--cc);color:#fff;opacity:1;text-decoration:none}
.c.k-shoot{background:var(--sunk);color:var(--tx2)}
.c.k-term{background:var(--ink);color:#fff}
.c.dn{opacity:.45;text-decoration:line-through}
.more{font-size:10.5px;color:var(--tx3);padding-left:4px}
.modal .mc{min-height:46px}
.legend{display:flex;gap:6px;margin:10px 2px 0}
.legend .c{font-size:12px;padding:2px 8px}
.daypanel{margin-top:6px}
.daypanel h2{text-transform:none;letter-spacing:-.01em;font:700 20px/1.2 var(--fd);color:var(--ink)}

/* filtry */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--surf);border:1px solid var(--line2);font-size:14.5px;font-weight:600;color:var(--tx2)}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchips button.add{border-style:dashed;color:var(--tx3)}
.fchips.wrapc{flex-wrap:wrap;overflow:visible;margin:0 0 4px;padding:0}

/* panely */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel p{margin:0 0 10px;color:var(--tx2);font-size:14.5px;line-height:1.5}
.panel .l:first-child{margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tags span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink)}
.learn{border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.learn .lh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.learn .lh b{font:700 18px/1.2 var(--fd)}
.learn .lh small{color:var(--tx3);font-size:13px}
.learn .lr{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.learn .lr span{font-size:13px;color:var(--tx3);width:70px}
.learn .lr i{font-style:normal;font-size:13.5px;padding:3px 9px;border-radius:99px;background:var(--sunk)}
.learn .lr i b{color:var(--brand)}
.creator{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.creator .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.creator .ch .rt{flex:1;min-width:0}
.creator .ch b{font:700 18px/1.2 var(--fd)}
.creator .ch small{display:block;color:var(--tx3);font-size:13.5px}
.creator .row.rb{min-height:50px;padding:10px 14px}
.creator .row.rb .rt span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creator>.btn{margin:4px 6px 8px}
.ratio{flex:none;min-width:52px;text-align:center;font:800 16px/1 var(--fd);padding:7px 6px;border-radius:9px;background:var(--sunk);color:var(--tx2)}
.ratio.hit{background:var(--brand);color:#fff!important}
.bignum{display:flex;align-items:center;gap:14px;padding:20px 4px 4px}
.bignum b{font:800 60px/1 var(--fd);letter-spacing:-.04em}
.bignum span{color:var(--tx2);font-size:14.5px;line-height:1.4}

/* nastavení */
.schr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.schr input{flex:1;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:99px;height:42px}
.stepper button{width:36px;height:40px;font-size:19px;color:var(--tx2)}
.stepper b{min-width:30px;text-align:center;font:700 16px var(--fd)}
.olist{padding-left:20px;margin:0 0 12px;color:var(--tx2);font-size:14.5px}
.olist li{margin-bottom:6px}
code{font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px}

/* detail videa */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--safe-t);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}}
.sheet .bar{position:sticky;top:0;z-index:3;background:var(--bg)}
.sheet .bar .wrap{display:flex;align-items:center;gap:4px;height:56px}
.saved{font-size:13px;color:var(--tx3);margin-right:auto;margin-left:4px}
.ed{padding-bottom:calc(120px + var(--safe-b))}
textarea.ttl{border:0;background:none;padding:2px 0;font:800 30px/1.12 var(--fd);letter-spacing:-.025em;border-radius:0}
.steps{display:flex;gap:4px;margin:14px 0 12px}
.steps button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx3);padding:4px 0}
.steps button span{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line2);display:grid;place-items:center;font:700 13px var(--fd);color:var(--tx3);background:var(--surf)}
.steps button span svg{width:15px;height:15px;stroke-width:3}
.steps button.on{color:var(--ink)}
.steps button.on span{background:var(--brand);border-color:var(--brand);color:#fff}
.steps button.cur span{box-shadow:0 0 0 3px var(--brand-soft)}
.ed .fld{margin-top:10px}
.ed h2{margin-top:26px}
.part{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px 10px;margin-bottom:8px}
.part .ph{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--tx3);padding-top:4px}
.part .ph input{border:0;padding:4px 0;font-weight:700;font-size:15px;color:var(--ink)}
.part textarea,.part input{border:0;padding:6px 0;border-radius:0;font-size:16.5px}
.part textarea.see{font-size:15px;color:var(--tx2);border-top:1px dashed var(--line);padding-top:7px}
.hl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin-top:8px}
.h3c{display:inline-flex;gap:4px;margin-left:auto;text-transform:none;letter-spacing:0}
.h3c i{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--tx3)}
.h3c i.ok{background:var(--brand-soft);color:var(--brand-ink)}
.dbtn{display:flex;flex-direction:column;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line);text-align:left}
.dbtn small{font-size:12.5px;color:var(--tx3);font-weight:600}
.dbtn b{font:700 17px/1.3 var(--fd);color:var(--tx3)}
.dbtn.set b{color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;margin:22px 2px 0;font-size:15px;color:var(--tx2)}
.chk input{width:20px;height:20px;accent-color:var(--brand);-webkit-appearance:auto;appearance:auto;flex:none}
.resbox .l{margin-top:10px}
textarea.notes{min-height:60px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + var(--safe-b));background:var(--surf);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.foot .info{flex:1;font-size:13.5px;color:var(--tx2)}
.foot .info b{font:700 16px var(--fd);color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:#16161A59;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(14px + var(--safe-b))}
.modal .box h3{margin:0 0 8px;font:800 24px/1.15 var(--fd);letter-spacing:-.02em}
.modal .muted{margin-top:-2px}
.modal .part{margin-bottom:0}
.numset .l{margin-top:12px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* čtečka */
#prompter{position:fixed;inset:0;z-index:50;background:#0B0B0D;color:#F5F4F1}
#prompter .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
#prompter .scroll::-webkit-scrollbar{display:none}
#prompter .txt{padding:45vh 7vw 80vh;font-weight:600;line-height:1.45;white-space:pre-wrap;word-break:break-word;font-family:var(--fb)}
#prompter .txt .sec{color:#FFB98F;font-size:.4em;display:block;margin:1.4em 0 .3em;font-weight:600}
#prompter.mirror .txt{transform:scaleX(-1)}
#prompter .guide{position:absolute;left:0;right:0;top:38vh;height:1px;background:#F26A1B80;pointer-events:none}
#prompter .ctl{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));background:#0B0B0Df0;border-top:1px solid #222;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;transition:opacity .3s}
#prompter.playing .ctl{opacity:.1}
#prompter .ctl .btn{background:#1C1C20;border-color:#2C2C32;color:#fff}
#prompter .ctl .btn.pri{background:var(--brand);border-color:var(--brand)}
#prompter .ctl label{font-size:12.5px;color:#999;display:flex;align-items:center;gap:6px}
#prompter .ctl input[type=range]{width:110px;padding:0;accent-color:var(--brand);background:none;border:0;-webkit-appearance:auto;appearance:auto}
#prompter .close{position:absolute;top:calc(10px + var(--safe-t));right:12px;z-index:2;color:#fff;background:#1C1C20}

@media (min-width:700px){
  .mc{min-height:92px}
  .c{font-size:11.5px}
}

/* týden na Dnes */
.wpanel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;margin-bottom:12px;cursor:pointer}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wsd_{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:10px}
.wsd_ small{font-size:11.5px;color:var(--tx3);font-weight:500}
.wsd_ b{font:700 17px/1.2 var(--fd)}
.wsd_.tod{background:var(--ink);color:#fff}
.wsd_.tod small{color:#bbb}
.wsd_.past b{color:var(--tx3)}
.wsd_ span{display:flex;gap:3px;height:7px;align-items:center}
.wsd_ i{width:6px;height:6px;border-radius:50%}
.wsd_ i.p{--cc:var(--pub);box-shadow:inset 0 0 0 1.5px var(--cc)}
.wsd_ i.p.ok{background:var(--cc);box-shadow:none}
.wsd_ i.s{background:var(--tx3)}
.wsd_.tod i.s{background:#aaa}
.wline{font-size:14px;color:var(--tx2);padding:8px 6px 0;line-height:1.4}
.wline b{font:800 18px var(--fd);color:var(--ink)}
.wline .z{color:var(--brand-ink);font-weight:600}
.shootday.plan{background:var(--surf);border-color:var(--ink);color:var(--ink)}
.shootday.plan small{color:var(--tx2)}
/* checklisty v detailu */
.chkb{margin-top:12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chkb .list{border:0;border-top:1px solid var(--line);border-radius:0}
.chkhead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.chkhead b{flex:1;font-weight:600}
.chkhead span{font:800 16px var(--fd);color:var(--brand)}
.chkb.full .chkhead span{color:var(--tx3)}
.chev{display:grid;color:var(--tx3);transition:transform .15s}
.chev svg{width:16px;height:16px}
.chev.o{transform:rotate(90deg)}
.row.task.on .tick{background:var(--brand);border-color:var(--brand);color:#fff}
h2 .btn{text-transform:none;letter-spacing:0}
.row.hk{align-items:flex-start;cursor:pointer}
.row.hk .rt span{font-size:15px;margin-bottom:3px}
.row.hk em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-right:4px}
#hbank{margin:0 0 4px}
a.btn{text-decoration:none}

/* rychle zapsat */
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(78px + var(--safe-b));z-index:7;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.94)}
.capin{display:flex;gap:8px;margin-top:2px}
.capin input{flex:1;min-width:0;height:50px}
.capin .btn{height:50px}
#cm{margin:6px 0 10px}
.row .chev{color:var(--tx3);display:grid}
.row .chev svg{width:16px;height:16px}
.stack .btn{width:100%}
.nosel button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cbtns{margin-top:12px}

/* typy dnů */
:root{--ty-shoot:#C24E0E;--ty-edit:#2F6FDB;--ty-write:#8B5CF6;--ty-plan:#0E9AA7;--ty-off:#8A8A90}
.ty-shoot{--tc:var(--ty-shoot)}.ty-edit{--tc:var(--ty-edit)}.ty-write{--tc:var(--ty-write)}.ty-plan{--tc:var(--ty-plan)}.ty-off{--tc:var(--ty-off)}
em.ty{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,#fff);margin-right:4px}
.wdh em.ty{margin:0}
.dtypes{margin-bottom:10px}
.dtypes button{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 35%,#fff)}
.dtypes button.on{background:var(--tc);border-color:var(--tc);color:#fff}
.daybox{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.daybox>b{display:block;font:700 18px/1.2 var(--fd);color:var(--tc)}
.daybox>small{display:block;color:var(--tx2);font-size:13.5px;margin:2px 0 0}
.daybox .list{margin-top:10px;border-radius:12px}
.wsd_ u{display:block;height:13px;font-size:9.5px;font-weight:700;text-decoration:none;color:var(--tc,transparent);text-transform:uppercase;letter-spacing:.02em}
.wsd_.tod u{color:#fff}
.wline.ahead{padding-top:4px;color:var(--tx2)}

/* kategorie */
.cats{display:grid;gap:7px;padding:10px 6px 2px}
.counter .cats{padding:12px 0 0}
.catrow{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;align-items:center;gap:10px}
.catrow .cn{font-size:14px;font-weight:600;color:color-mix(in srgb,var(--cc) 75%,#000);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.catrow .bars{display:flex;gap:3px}
.catrow .bars i{flex:1;height:10px;border-radius:3px;background:var(--sunk)}
.catrow .bars i.p{background:none;box-shadow:inset 0 0 0 1.5px var(--cc)}
.catrow .bars i.r{background:color-mix(in srgb,var(--cc) 45%,#fff)}
.catrow .bars i.d{background:var(--cc)}
.catrow .cx{font-size:13px;color:var(--tx2);white-space:nowrap}
.catrow .cx b{font:800 16px var(--fd);color:var(--ink)}
.catrow .cx.ok{color:var(--tx3)}
.counter .big b small{font-size:22px;color:var(--tx3);font-weight:700}
.catchips button{display:inline-flex;align-items:center;gap:6px}
.catchips button i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.catchips button.on{background:var(--cc);border-color:var(--cc);color:#fff}
.catchips button.on i{background:#fff}
.catchips button.add i{display:none}
.row.vid{padding-left:0;gap:10px}
.cbar{width:4px;align-self:stretch;border-radius:0 3px 3px 0;background:var(--cc);flex:none;margin:-12px 0}
.row.vid .cn{font-weight:600}
.pchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.schr .sw{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.wpl{display:flex;align-items:center;gap:10px;margin-top:8px}
.wpl b{width:80px;font-weight:600;font-size:15px}
.wpl select{flex:1;padding:9px 12px}

/* velký kalendář */
body.wide main.wrap,body.wide .top .wrap{max-width:1100px}
.mgrid.big{margin:0 -16px;border-radius:0;border-left:0;border-right:0}
.mgrid.big .mc{min-height:104px;padding:4px 3px 5px;gap:3px}
.mgrid.big .c{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;line-height:1.25;padding:2px 4px;word-break:break-word}
.mc .dh{display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%}
.mc .dh em{font-style:normal;font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--tc);letter-spacing:.02em}
.mc[class*="ty-"]{background:color-mix(in srgb,var(--tc) 6%,#fff)}
.mc.out[class*="ty-"]{background:#FAF9F7}
.mgrid.pick .mc{min-height:52px;align-items:center}
.mgrid.pick .mc .dh{justify-content:center;flex-direction:column}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:40px}
.dots i,.legend .lg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dots i.sh,.legend .lg i.sh{background:var(--tx3)}
.dots i.tm,.legend .lg i.tm{background:var(--ink)}
.legend{flex-wrap:wrap;gap:6px 12px;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tx2)}
.legend .lg i{width:9px;height:9px}
@media (min-width:700px){
  .mgrid.big{margin:0;border-radius:var(--r);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .mgrid.big .mc{min-height:130px}
  .mgrid.big .c{font-size:12px}
}
/* výběr dne */
.list.pk{max-height:52dvh;overflow-y:auto}
.row.pkd{width:100%;text-align:left;align-items:flex-start;min-height:52px;padding:10px 12px}
.row.pkd .dl{width:58px;flex:none}
.row.pkd .dl b{display:block;font:700 15px/1.1 var(--fd)}
.row.pkd .dl small{color:var(--tx3);font-size:12px}
.row.pkd .rt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row.pkd .rt .vchip{padding:3px 9px;font-size:13px;cursor:inherit}
.row.pkd .rt>small{color:var(--tx3)}
.row.pkd.sel{background:var(--brand-soft)}
.row.pkd.hint2 .dl b{color:var(--ty-shoot)}
.row.vid .rt small .cn{display:inline}

/* zkratky kategorií */
.ab{display:inline-block;font:800 11px/1 var(--fb);letter-spacing:.03em;padding:3px 6px;border-radius:5px;background:var(--cc);color:#fff;vertical-align:1px}
.ab0{font-weight:800;font-size:.8em;letter-spacing:.03em;margin-right:5px;opacity:.85}
.vchip.k-date.s-done .ab0{opacity:1}
.c b{font-weight:800;font-size:.9em}
.catrow .cn .ab{margin-right:2px}
.abin{width:64px!important;flex:none!important;text-transform:uppercase;text-align:center;padding:11px 6px}
/* sloty */
.sgrid{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sgh,.sgr{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px;align-items:stretch;padding:6px 8px}
.sgh{padding-top:9px;padding-bottom:2px}
.sgh span{font-size:12px;font-weight:600;color:var(--tx3);text-align:center}
.sgr{border-top:1px solid var(--line)}
.sgh+.sgr{border-top:0}
.sgr.tod{background:#FFFAF6}
.sgr.past{opacity:.55}
.sgr .sd{display:flex;flex-direction:column;justify-content:center}
.sgr .sd b{font:700 15px/1.1 var(--fd)}
.sgr .sd small{font-size:12px;color:var(--tx3)}
.sgr.tod .sd b{color:var(--brand)}
.sc{min-height:52px;border-radius:10px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sc i{font-style:normal;font-size:12.5px;color:var(--tx3)}
.sc.on{border:0;background:color-mix(in srgb,var(--cc) 16%,#fff)}
.sc.on b{font:800 15px/1 var(--fd);color:color-mix(in srgb,var(--cc) 80%,#000);letter-spacing:.02em}
.sc small{font-size:11px;line-height:1.2;color:var(--tx2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc small.miss{color:var(--bad)}
.sgrid.one .sgr{grid-template-columns:repeat(3,1fr);border:0;padding:8px}
.slot.ps .sl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-top:5px}
.slot.ps .sl small{font-size:11.5px;color:var(--tx3)}
.vchip.k-slot,.c.k-slot{background:none!important;box-shadow:inset 0 0 0 1.5px var(--cc);color:color-mix(in srgb,var(--cc) 75%,#000);border-style:dashed}
.c.k-slot{box-shadow:none;border:1.5px dashed var(--cc);opacity:.9}
.vchip.k-slot.fit{background:color-mix(in srgb,var(--cc) 14%,#fff)!important;font-weight:700}
.row.pkd.fit .dl b{color:var(--brand)}
.catpick{display:grid;gap:8px}
.catpick button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surf);border:1.5px solid color-mix(in srgb,var(--cc,#999) 40%,#fff);text-align:left}
.catpick button b{font:800 15px var(--fd);min-width:46px;text-align:center;padding:6px 0;border-radius:8px;background:var(--cc,#999);color:#fff}
.catpick button span{font-size:16px;font-weight:600}
.catpick button.on{background:color-mix(in srgb,var(--cc) 14%,#fff)}
.catpick button.none{--cc:#9B9BA2}
#cfmt.need button{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seg.parts{margin:8px 0 0}
/* kalendář: přepínače a 2 týdny */
.calbar{display:flex;gap:8px;margin-bottom:10px}
.calbar .seg{flex:1;margin:0}
.seg.sm button{height:32px;font-size:13.5px}
.mgrid.tall .mc{min-height:150px}
.mgrid.tall .c{-webkit-line-clamp:3}
@media (min-width:700px){.mgrid.tall .mc{min-height:190px}}
.row .rt b.ab,.row .lbl b.ab{display:inline-block;width:auto}
.row .rt .vchip b,.row .rt .c b{display:inline}
.vchip.k-slot{box-shadow:none;border:1.5px dashed var(--cc)}
.row .rt b.ab,.row .lbl b.ab{font:800 11px/1 var(--fb);padding:3px 6px;vertical-align:1px}
.row .rt .vchip b,.row .rt .c b{font-size:.8em;font-weight:800}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2.2" fill="#fff"/><path d="M3.2 9.4 19.6 5.6l.6 2.7L3.8 12.1z" fill="#fff"/><path d="M7 8.5 9 8M12 7.4l2-.5M17 6.3l1.5-.3" stroke="#F26A1B" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  <h1 id="vtitle">Dnes</h1>
  <div id="topx"></div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="wrap">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Dnes</button>
  <button data-v="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M7.5 14h2M11 14h2M14.5 14h2"/></svg>Týden</button>
  <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalendář</button>
  <button data-v="vids"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Videa</button>
  <button data-v="insp"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Inspirace</button>
</div></nav>

<section id="editor" class="sheet" hidden></section>
<div id="prompter" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';

function todayItems() {
  const t = today(), out = [];
  db.ideas.forEach(i => {
    if (i.status !== 'done' && i.date && i.date < t) out.push({ k: 'late', i });
    else if (i.status !== 'done' && i.date === t) out.push({ k: 'pub', i });
    if (SI(i.status) < SI('shot') && i.shoot && i.shoot <= t) out.push({ k: 'shoot', i });
    const soon = (i.shoot && i.shoot <= addDays(t, 2)) || (i.date && i.date <= addDays(t, 3));
    if (i.status === 'idea' && soon && !(i.shoot && i.shoot <= t)) out.push({ k: 'write', i });
    if (i.status === 'done' && i.date) {
      if (i.date <= addDays(t, -2) && i.date >= addDays(t, -14) && !parseNum(i.r48.v)) out.push({ k: 'n48', i });
      else if (i.date <= addDays(t, -7) && i.date >= addDays(t, -30) && !parseNum(i.r7.v)) out.push({ k: 'n7', i });
    }
  });
  [t, addDays(t, 1)].forEach(d => slotsOn(d).forEach(s => { if (!slotVids(d, s.part).length) out.push({ k: 'slot', s, d }); }));
  const ord = { late: 0, slot: 1, shoot: 2, write: 3, pub: 4, n48: 5, n7: 6 };
  return out.sort((a, b) => ord[a.k] - ord[b.k]);
}

function longPress(el, fn) {

  const stop = () => { clearTimeout(t); t = null; };
  el.addEventListener('pointerdown', e => { fired = false; x0 = e.clientX; y0 = e.clientY; stop(); t = setTimeout(() => { fired = true; t = null; if (navigator.vibrate) navigator.vibrate(15); fn(); }, 500); });

  el.addEventListener('click', e => { if (fired) { e.preventDefault(); e.stopImmediatePropagation(); fired = false; } }, true);
  el.addEventListener('contextmenu', e => { e.preventDefault(); if (!fired) { stop(); fn(); } });
}

function calChips(d, f = 'all') {

  const pubC = i => `<span class="c k-pub ${i.status === 'done' ? 'dn' : ''}" style="--cc:${catColor(i)}">${catOf(i) ? `<b>${esc(catAbbr(catOf(i)))}</b> ` : ''}${i.status === 'done' ? '✓ ' : ''}${esc(i.title)}</span>`;
  if (f !== 'shoot') {
    slotsOn(d).forEach(s => { const l = slotVids(d, s.part), c = catById(s.cat); if (l.length) l.forEach(i => out.push(pubC(i))); else out.push(`<span class="c k-slot" style="--cc:${c.color}"><b>${esc(catAbbr(c))}</b> ${PARTS[s.part].s}</span>`); });
    freePubs(d).forEach(i => out.push(pubC(i)));
  }
  if (f !== 'pub') onDay(d, 'shoot').forEach(i => out.push(`<span class="c k-shoot ${SI(i.status) >= SI('shot') ? 'dn' : ''}">${catOf(i) ? `<b>${esc(catAbbr(catOf(i)))}</b> ` : ''}${esc(i.title)}</span>`));
  return out;
}

function videoText(i) {
  const s = [`# ${i.title}`, [i.fmt, ST[i.status], i.shoot ? 'natočit ' + fmtDate(i.shoot) : '', i.date ? 'vydat ' + fmtDate(i.date) : ''].filter(Boolean).join(' · ')];

// co funguje u mě: stejné pravidlo 3× z mých výsledků podle formátu, vedle tvůrců
function meHTML() {
  const head = `<div class="panel"><p>Pravidlo 3× na tvých videích: zhlédnutí ÷ tvoji sledující.</p><label class="l">Kolik máš sledujících</label><input id="myf" inputmode="decimal" placeholder="Např. 2,5k" value="${db.myF || ''}"></div>`;
  const done = db.ideas.filter(i => i.status === 'done' && resOf(i).v);
  if (!db.myF || !done.length) return head + `<div class="calm"><b>Zatím bez dat.</b><span>${!db.myF ? 'Zadej nahoře počet sledujících.' : 'Zapiš čísla u vydaných videí – po 48 h a po 7 dnech.'}</span></div>`;
  const g = {};
  done.forEach(i => { const k = i.fmt || 'Bez formátu'; (g[k] = g[k] || []).push(i); });
  const creators = f => { const l = rbs().filter(r => (r.shot || []).some(x => sameFmt(x, f)) && ratio(r)); return l.length ? l.reduce((a, r) => a + ratio(r), 0) / l.length : 0; };
  const avg = l => l.reduce((a, i) => a + myRatio(i), 0) / l.length;
  const rows = Object.entries(g).sort((a, b) => avg(b[1]) - avg(a[1])).map(([f, l]) => {
    const a = avg(l), hits = l.filter(i => myRatio(i) >= 3).length, best = [...l].sort((x, y) => myRatio(y) - myRatio(x))[0], cr = creators(f);
    return row(`<b>${esc(f)}</b>`, `${videos(l.length)}${hits ? ` · ${hits}× nad 3×` : ''} · nejlepší: ${esc(best.title)}`, `<div class="num"><b class="${a >= 3 ? 'hit' : ''}">${fmtX(a)}</b><small>${cr ? 'tvůrci ' + fmtX(cr) : 'průměr'}</small></div>`);
  });
  const all = avg(done), hitsAll = done.filter(i => myRatio(i) >= 3).length;
  return head + `<div class="bignum"><b class="${all >= 3 ? 'hit' : ''}">${fmtX(all)}</b><span>průměr z ${videos(done.length)}<br>${hitsAll}× splněno pravidlo 3×</span></div>
    <h2>Podle formátu</h2><div class="list">${rows.join('')}</div>`;
}

const SKEY = 'studio.sync', GFILE = 'studio-data.json', GDESC = 'Studio – data appky (nemazat)';

async function gh(path, opt = {}) {

function mergeDb(a, b) {

  };

    ideas: mg(a.ideas, b.ideas).sort(byIdDesc), insp: mg(a.insp, b.insp).sort(byIdDesc),
    tasks: mg(a.tasks, b.tasks).sort(asc), terms: mg(a.terms, b.terms).sort(asc), channels: mg(a.channels, b.channels).sort(asc), pillars: mg(a.pillars, b.pillars).sort(asc), cats: mg(a.cats, b.cats).sort(asc), days: mg(a.days, b.days).sort(asc), slots: mg(a.slots, b.slots).sort(asc), schedule: mg(a.schedule, b.schedule).sort(asc),

const typing = () => { const el = document.activeElement; return el && /INPUT|TEXTAREA|SELECT/.test(el.tagName) && el.closest('#view, #modal'); };
