<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kodad boost</title>
<meta name="theme-color" content="#0C0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kodad boost">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>/* Layout: jednosloupcová appka v duchu předlohy · černé pozadí, velké zaoblené karty, bílá hlavní tlačítka, plovoucí spodní lišta */
:root{
  --bg:#0A0A0A; --card:#1C1C1E; --card2:#262628; --card3:#323234; --line:#2E2E31;
  --fg:#F5F5F7; --mut:#8E8E93; --dim:#5C5C61;
  --done:#8BD43B; --done-soft:rgba(139,212,59,.14);
  --prog:#35D0C9; --prog-soft:rgba(53,208,201,.15);
  --down:#E5484D; --down-soft:rgba(229,72,77,.15);
  --warn:#F07B2C; --ice:#9ACBF5; --heat:#F28C4E; --sick:#D46A93;
  --white:#FFFFFF; --ink:#0A0A0A;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --r:26px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:16px/1.4 var(--f);letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(118px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--prog);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg);letter-spacing:inherit}
.num,input{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.up-t{text-transform:uppercase;letter-spacing:.02em}
.lbl{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{display:block;color:var(--fg)}
.mark svg{display:block;height:100%;width:auto}

/* header */
.hdr{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding-block:14px 18px}
.hdr .mark{height:26px;justify-self:center}
.hdr h1{justify-self:center;font-size:19px;font-weight:700;letter-spacing:0}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--fg)}
.round:active{background:var(--card2)}
.round.ghost{background:none;border-color:transparent}

/* buttons */
.pill{display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 24px;border-radius:999px;font-size:19px;font-weight:700;width:100%}
.pill.white{background:var(--white);color:var(--ink)}
.pill.dark{background:var(--card2);border:1px solid #4A4A4D;color:var(--fg)}
.pill.lime{background:var(--done);color:var(--ink)}
.pill:active{filter:brightness(.92)}
.pill svg.i{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--card2);font-weight:600;font-size:16px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.white{background:var(--white);color:var(--ink)}
.btn.danger{color:var(--down)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.2)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:22px}
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 14px}
.sec-h h2{font-size:26px;font-weight:700}
.sec-h button{color:var(--mut);font-size:17px;display:flex;align-items:center;gap:4px}

/* home plan card */
.plan{padding:26px 24px 24px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
.plan h1{font-size:34px;line-height:1.02;text-transform:uppercase}
.plan .sub{margin-top:8px;font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:10px;flex-wrap:wrap}
.plan .sub b{color:var(--fg);font-weight:700}
.plan .sub i{font-style:normal;color:var(--dim)}
.ringrow{display:flex;align-items:center;gap:22px;margin:24px 0}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700}
.ringrow .side{display:grid;gap:12px;min-width:0}
.mini{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.mini .mr{width:44px;height:44px;flex:none;position:relative}
.mini .mr svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini .mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.ringrow p{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);line-height:1.35}
.plan.live h1{color:var(--done)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:18px}
.wd{display:grid;justify-items:center;gap:10px;color:var(--mut);font-size:15px}
.wd .c{width:42px;height:42px;max-width:100%;border-radius:50%;border:2.5px solid #5A5A5E;display:grid;place-items:center;color:var(--fg)}
.wd .c svg{width:18px;height:18px;stroke-width:2.6}
.wd.done .c{border-color:var(--done);color:var(--done)}
.wd.part .c{border-color:var(--warn);color:var(--warn)}
.wd.sick .c{border-color:var(--sick)}
.wd.act .c{border-color:var(--prog);color:var(--prog)}
.wd.today span{color:var(--fg);font-weight:700}
.wd.today .c{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px #6A6A6E}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:20px;font-size:14px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:9px;height:9px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:18px;padding:18px;border-radius:22px;background:var(--card);text-align:left}
.tile .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.tile b{display:block;font-size:19px;font-weight:700}
.tile small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.lastc{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.lastc .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--done)}
.lastc .t{flex:1;min-width:0}
.lastc .t b{display:block;font-size:20px;font-weight:600;text-transform:uppercase}
.lastc .t small{color:var(--mut);font-size:15px}
.lastc .n{font-size:28px;font-weight:700}
.lastc .n small{font-size:14px;color:var(--mut);font-weight:500}
.empty{padding:22px;border:1px dashed #3A3A3D;border-radius:var(--r);color:var(--mut);display:grid;gap:14px}
.empty b{color:var(--fg);font-size:18px}

/* floating nav */
nav.tabs{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:40px;
  background:rgba(32,32,34,.86);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line)}
nav.tabs button{display:grid;justify-items:center;gap:3px;padding:9px 0 8px;border-radius:32px;color:var(--fg);font-size:13px;font-weight:600}
nav.tabs button svg.i{width:26px;height:26px}
nav.tabs button.on{background:#3A3A3D}

/* lists */
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.li{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border-radius:20px;width:100%;text-align:left}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:17px}
.li .t small{display:block;color:var(--mut);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--dim)}
.li .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.search{width:100%;height:50px;border-radius:999px;background:var(--card);border:1px solid var(--line);padding:0 20px;font-size:17px;margin-bottom:14px}
.grp{margin:22px 4px 10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--card2);color:#C7C7CC;white-space:nowrap}
.chip.o{background:none;border:1.5px solid #E6E6E9;color:var(--fg);font-size:16px;font-weight:500;padding:9px 18px}
.chip.uni{color:var(--ice)}
.chip.prog{background:var(--prog-soft);color:var(--prog)}
.chip.down{background:var(--down-soft);color:var(--down)}

/* workout */
.timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 18px;width:max-content;padding:12px 34px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer svg.i{width:28px;height:28px}
.ex{background:var(--card);border-radius:var(--r);margin-top:14px;overflow:hidden}
.exh{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px 18px 22px;text-align:left}
.exh .bar{width:6px;align-self:stretch;border-radius:3px;background:#48484C;flex:none}
.ex.done .exh .bar{background:var(--done)} .ex.part .exh .bar{background:var(--warn)}
.exh .t{flex:1;min-width:0}
.exh .nm{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;line-height:1.2}
.exh .nm .inf{color:var(--mut);display:grid;place-items:center;width:30px;height:30px;margin:-4px 0;border-radius:50%}
.exh .sb{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;color:var(--mut);font-size:17px;margin-top:4px}
.dots{display:flex;gap:6px}
.dots u{width:16px;height:16px;border-radius:50%;border:2px solid var(--down)}
.dots u.ok{border-color:var(--done);background:var(--done)}
.exh .cv{color:var(--fg);transition:transform .2s}
.ex.open .exh .cv{transform:rotate(180deg)}
.exb{border-top:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tools .chips{flex:1;min-width:0}
.tools .tb{width:46px;height:38px;border-radius:999px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--fg)}
.tools .tb svg.i{width:20px;height:20px}
.last{padding:12px 20px 0;font-size:14px;color:var(--mut)}
.last b{color:var(--fg);font-weight:500}
.tbl{display:grid}
.th,.tr{display:grid;grid-template-columns:44px 1fr 1fr 74px 52px;align-items:center}
.th{padding:10px 8px 8px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;text-align:center}
.th span+span,.tr>*+*{border-left:1px solid var(--line)}
.tr{min-height:66px;border-bottom:1px solid var(--line);text-align:center;padding:0 8px}
.tr.sideR{border-bottom-color:var(--line)}
.tr .no{font-size:18px;font-weight:500}
.tr input{width:100%;height:50px;border:0;background:transparent;text-align:center;font-size:23px;font-weight:500;padding:0 4px;border-radius:12px}
.tr input:focus{background:var(--card2);outline:none}
.tr input::placeholder{color:#5C5C61}
.rc{position:relative}
.rc .ar{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:700;pointer-events:none}
.ar.up{color:var(--prog)} .ar.down{color:var(--down)} .ar.eq{color:var(--dim)}
.rg{display:grid;justify-items:center;gap:3px;font-size:13px;color:var(--mut);font-weight:600}
.fbadge{display:inline-grid;place-items:center;min-width:44px;height:28px;border-radius:999px;border:2px solid var(--down);color:var(--fg);font-size:14px;font-weight:800}
.ck{display:grid;place-items:center}
.ck span{width:42px;height:30px;border-radius:999px;border:2px solid #4A4A4D;display:grid;place-items:center;color:transparent}
.ck span svg{width:18px;height:18px;stroke-width:3}
.ck.ok span{border-color:var(--done);color:var(--done)}
.nx{padding:12px 20px 4px;display:grid;gap:5px;font-size:14px;color:var(--mut)}
.nx .up{color:var(--prog)} .nx .down{color:var(--down)} .nx b{color:var(--fg);font-weight:600}
.nx .up b{color:var(--prog)}
.notep{display:block;width:calc(100% - 32px);margin:12px 16px 18px;min-height:54px;border-radius:28px;border:0;background:var(--card3);padding:15px 22px;font-size:17px;resize:none;line-height:1.4}
.notep::placeholder{color:#A1A1A6}
.dock{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;
  display:flex;gap:10px;align-items:center;padding:12px;border-radius:34px;background:rgba(40,40,42,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line)}
.dock .pill{min-height:56px;font-size:18px}
.dock .add{background:#3A3A3D;flex:1}
.dock .add svg{color:var(--done)}
.dock .fin{flex:1.2;background:var(--done);color:var(--ink)}

/* finish flow */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 8px 0}
.steps i{height:5px;border-radius:3px;background:#2C2C33}
.steps i.on{background:var(--white)}
.fl{min-height:calc(100vh - 260px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:30px 0}
.fl .mark{height:34px;margin:0 auto 34px}
.fl .lbl{color:var(--fg);letter-spacing:.2em;font-size:15px}
.fl .huge{font-size:76px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.02em}
.fl .huge small{font-size:40px}
.fl h2{font-size:30px;text-transform:uppercase;margin-top:8px}
.fl .chips{justify-content:center;margin-top:22px;gap:10px}
.bottom-acts{display:grid;gap:12px;margin-top:10px}
.burst{position:relative;width:200px;height:150px;margin:24px auto 10px}
.burst span{position:absolute;border-radius:50%;display:grid;place-items:center;border:2px solid var(--prog);background:rgba(53,208,201,.08);color:var(--fg)}
.burst span svg{stroke-width:2.4}
.gl{display:grid;gap:12px;margin-top:22px;text-align:left}
.gi{display:flex;align-items:center;gap:12px;padding:20px 22px;border-radius:24px;background:var(--card)}
.gi .t{flex:1;min-width:0}
.gi .t b{display:block;font-size:19px;font-weight:500}
.gi .t small{color:var(--mut);font-size:16px}
.gi .r{display:grid;justify-items:end;gap:8px}
.gi .r .p{display:flex;align-items:center;gap:8px}
.gi .r .p .cir{width:32px;height:32px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
.gi .r .p .cir svg{width:16px;height:16px;stroke-width:2.6}
.gi .r .p em{font-style:normal;font-weight:700;padding:6px 14px;border-radius:999px;font-size:16px}
.gi .r .from{color:var(--mut);font-size:16px;white-space:nowrap}
.gi.up .p{color:var(--prog)} .gi.up .p em{background:var(--prog-soft)} .gi.up .from b{color:var(--prog);font-weight:500}
.gi.kg .p{color:var(--done)} .gi.kg .p em{background:var(--done-soft)} .gi.kg .from b{color:var(--done);font-weight:500}
.gi.down .p{color:var(--down)} .gi.down .p em{background:var(--down-soft)} .gi.down .from b{color:var(--down);font-weight:500}
.ov h1{font-size:40px;margin:4px 0 20px}
.ovc{background:var(--card);border-radius:var(--r);overflow:hidden}
.ovc .row{display:flex;align-items:center;gap:16px;padding:18px 22px;border-top:1px solid var(--line)}
.ovc .row:first-child{border-top:0}
.ovc .row .k{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#C7C7CC;flex:none}
.ovc .row input{flex:1;min-width:0;background:none;border:0;font-size:18px;padding:4px 0}
.ovc .row input::placeholder{color:var(--dim)}
.ovc .ttl{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:500;text-transform:uppercase}
.ovc .ttl i{width:6px;height:38px;border-radius:3px;background:var(--done)}
.ovc .row .v{font-size:19px;color:#4A9DFF;font-variant-numeric:tabular-nums}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:20px 12px;background:var(--card);border-radius:var(--r);margin-top:14px}
.feel button{display:grid;justify-items:center;gap:8px;color:#8E8E93;font-size:16px}
.feel button svg{width:46px;height:46px;stroke:none;fill:currentColor}
.feel button.on{color:var(--fg)}
.feel button.on svg{color:var(--done)}
.opt{display:grid;gap:12px;margin-top:14px}
.reco{padding:16px 18px;border-radius:20px;background:var(--prog-soft);color:var(--fg);font-size:15px;text-align:left}
.reco .lbl{color:var(--prog);display:block;margin-bottom:4px;font-size:12px}
.extbl{background:var(--card);border-radius:var(--r);overflow:hidden;margin-top:14px}
.extbl .eh{display:flex;align-items:center;gap:14px;padding:16px 20px}
.extbl .eh i{width:6px;height:44px;border-radius:3px;background:var(--done);flex:none}
.extbl .eh .t{flex:1;min-width:0}
.extbl .eh b{display:block;font-size:20px;font-weight:500}
.extbl .eh small{color:var(--mut);font-size:16px}
.extbl .th,.extbl .tr{grid-template-columns:52px 1fr 1fr 1fr}
.extbl .th{background:#161618;border-top:1px solid var(--line)}
.extbl .tr{min-height:56px;font-size:19px;border-bottom:0}
.extbl .tr span{display:flex;align-items:center;justify-content:center;gap:8px}
.badge-best{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid #8E8E93;font-size:14px;font-weight:600;white-space:nowrap}
.badge-best svg{color:#F4C542}
.extbl.best{box-shadow:inset 0 0 0 2px #8E8E93}
.sfix{position:fixed;z-index:26;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto}

/* forms + sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.65);animation:fade .2s}
#sheet .pn{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#161618;border-radius:32px 32px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
#sheet .grab{width:58px;height:6px;border-radius:3px;background:#4A4A4D;margin:6px auto 22px}
#sheet h2{font-size:26px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.form{display:grid;gap:16px;margin-top:16px}
.form label.f{display:grid;gap:7px;font-size:14px;color:var(--mut);font-weight:500}
.inp,.form input:not([type=checkbox]),.form textarea,.form select{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:12px 14px;font-size:17px}
.form textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:999px;font-size:15px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card3);color:var(--fg)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-radius:20px;background:var(--card);font-size:17px;font-weight:500;width:100%;text-align:left}
.sw small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.sw .k{width:51px;height:31px;border-radius:16px;background:#3A3A3D;position:relative;flex:none;transition:background .2s}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on .k{background:var(--done)}
.sw.on .k::after{transform:translateX(20px)}
.setcfg{display:grid;grid-template-columns:24px 1fr 1fr auto 34px;gap:8px;align-items:center}
.setcfg .n{font-weight:700;color:var(--mut)}
.setcfg input{min-height:46px!important;text-align:center}
.setcfg .fb{height:46px;padding:0 12px;border-radius:999px;border:2px solid #3A3A3D;font-size:13px;font-weight:800;color:var(--dim)}
.setcfg .fb.on{border-color:var(--down);color:var(--fg)}
.setcfg .rm{height:46px;color:var(--dim)}
.actions{display:flex;gap:10px;margin-top:22px}
.actions .btn{flex:1}
.confirm{margin-top:14px;padding:16px;border-radius:18px;background:var(--down-soft);display:grid;gap:10px;font-size:15px}
.info-b{display:grid;gap:14px;margin-top:16px;font-size:16px}
.info-b ul{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}

/* summary / stats */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:var(--r);overflow:hidden}
.stat3>div{display:grid;justify-items:center;gap:6px;padding:20px 8px;text-align:center}
.stat3>div+div{border-left:1px solid var(--line)}
.stat3 svg.i{width:28px;height:28px;color:#C7C7CC}
.stat3 span{font-size:14px;color:#C7C7CC}
.stat3 b{font-size:28px;font-weight:700}
.stat3 b.up{color:var(--prog)} .stat3 b.down{color:var(--down)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f);font-size:12px;fill:#C7C7CC}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.cal-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px}
.cal .dn{text-align:center;font-size:13px;color:var(--mut);padding-bottom:4px}
.cd{display:grid;justify-items:center;gap:4px;padding:2px 0;color:var(--fg)}
.cd .c{width:40px;height:40px;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:500;border:2px solid transparent}
.cd.out{visibility:hidden}
.cd.future .c{color:var(--dim)}
.cd.today .c{border-color:#6A6A6E}
.cd.gym .c{border-color:var(--done);color:var(--done);font-weight:700}
.cd.sick .c{border-color:var(--sick);color:var(--sick)}
.cd .ds{display:flex;gap:3px;height:6px}
.cd .ds u{width:6px;height:6px;border-radius:50%}
.dot-gym{background:var(--done)}.dot-cold{background:var(--ice)}.dot-heat{background:var(--heat)}.dot-act{background:var(--prog)}.dot-sick{background:var(--sick)}

/* activities */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.at{display:grid;justify-items:center;gap:10px;padding:18px 6px;border-radius:22px;background:var(--card);font-size:14px;font-weight:600}
.at .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.at.cold .ic,.li .ic.cold{color:var(--ice)} .at.heat .ic,.li .ic.heat{color:var(--heat)} .at.act .ic,.li .ic.act{color:var(--prog)}

/* overlays */
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--white);color:var(--ink);padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center}
#fx canvas{position:absolute;inset:0;width:100%;height:100%}
#fx .msg{position:relative;text-align:center;animation:fxin .5s ease}
#fx .msg b{display:block;font-size:60px;font-weight:800;letter-spacing:-.02em}
#fx .msg span{color:var(--mut);font-size:17px}
#fx.cold{background:radial-gradient(circle at 50% 40%,rgba(154,203,245,.16),rgba(10,10,10,.96) 70%)} #fx.cold b{color:var(--ice)}
#fx.heat{background:radial-gradient(circle at 50% 70%,rgba(242,140,78,.24),rgba(10,10,10,.96) 70%)} #fx.heat b{color:var(--heat)}
#fx.act{background:radial-gradient(circle at 50% 50%,rgba(53,208,201,.14),rgba(10,10,10,.96) 70%)} #fx.act b{color:var(--prog)}
@keyframes fxin{from{opacity:0;transform:scale(.96)}}
#shot{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#shot img{max-height:66vh;max-width:100%;border-radius:18px;-webkit-touch-callout:default}
#shot p{margin:0;color:var(--mut);font-size:14px;text-align:center;max-width:320px}
#shot .bottom-acts{width:100%;max-width:380px}
/* home v2 */
.htop{display:flex;align-items:center;justify-content:space-between;padding-block:14px 4px}
.htop .mark{height:24px}
.hdate{font-size:15px;color:var(--mut);margin:2px 4px 14px}
.gcard{position:relative;cursor:pointer;border-radius:30px;padding:24px 22px 20px;background:linear-gradient(160deg,#232326 0%,#141415 70%);border:1px solid #2E2E31;overflow:hidden}
.gcard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,212,59,.16),transparent 70%);pointer-events:none}
.gcard .lbl{color:var(--done);font-size:12px}
.gcard h1{font-size:44px;line-height:.98;text-transform:uppercase;margin-top:10px;letter-spacing:-.02em}
.gsub{margin:10px 0 0;color:#C7C7CC;font-size:15px}
.gtime{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--done);margin-top:8px}
.gcard.live{background:linear-gradient(160deg,#1E2A14 0%,#121411 75%);border-color:rgba(139,212,59,.35)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.w7{display:grid;justify-items:center;gap:7px;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:0}
.w7 i{width:100%;height:30px;border-radius:9px;background:#2A2A2D}
.w7.done i{background:var(--done)}
.w7.live i{background:var(--warn)}
.w7.sick i{background:repeating-linear-gradient(135deg,rgba(212,106,147,.55) 0 5px,#2A2A2D 5px 10px)}
.w7.today span{color:var(--fg)}
.w7.today i{box-shadow:inset 0 0 0 2px #8E8E93}
.w7 u{width:5px;height:5px;border-radius:50%;background:transparent}
.w7 u.on{background:var(--prog)}
.gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.gfoot .mut{font-size:14px}
.gplay{width:64px;height:64px;border-radius:50%;background:var(--done);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(139,212,59,.25)}
.gplay svg.i{width:28px;height:28px;stroke-width:2.4}
.gplay.ok{background:var(--card3);color:var(--done);box-shadow:none}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:24px;background:var(--card);text-align:left;min-height:150px;min-width:0}
.hcard .hic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);margin-bottom:6px}
.hcard b{font-size:19px;font-weight:700}
.hcard small{color:var(--mut);font-size:14px}
.hcard .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}

.hcard .stp{margin-top:auto}
.hrow{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:16px 18px;border-radius:22px;background:var(--card);text-align:left}
.hrow .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--done)}
.hrow .t{flex:1;min-width:0}
.hrow .t small{display:block;color:var(--mut);font-size:13px}
.hrow .t b{display:block;font-size:18px;text-transform:uppercase}
.hrow .n{color:#C7C7CC;font-size:15px;white-space:nowrap}
.hrow em{font-style:normal;color:var(--prog)}
.card .seg{background:var(--card2)}
.card .seg button.on{background:#4A4A4E}

function exHistory(exId) {

function chartSVG(h, ex) {
  const pts = h.slice(-14).map(({ s, e }) => ({ d: s.date, w: num(e.sets[0]?.w), r: repsOf(e.sets[0], ex) })).filter(p => p.w != null);
  if (pts.length < 2) return '<p class="mut" style="margin:6px">Graf se ukáže po dvou trénincích.</p>';
  const W = 340, H = 210, L = 38, R = 14, T = 22, B = 30;
  let mn = Math.min(...pts.map(p => p.w)), mx = Math.max(...pts.map(p => p.w));
  const span = Math.max(mx - mn, 4); const mid = (mn + mx) / 2; mn = mid - span * .75; mx = mid + span * .75;
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find(s => (mx - mn) / s <= 6) || 100;
  const ticks = []; for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) ticks.push(r2(v));
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj váhy první série">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2E31"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${kg(v)}</text>`).join('')}
    <line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#3A3A3D"/>
    <path d="${line}" fill="none" stroke="var(--prog)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? 'var(--prog)' : '#1C1C1E'}" stroke="var(--prog)" stroke-width="2"/><text x="${x(i)}" y="${y(p.w) - 10}" text-anchor="middle" style="fill:#F5F5F7;font-weight:600">${p.r}</text>`).join('')}
    <text x="${x(0)}" y="${H - 8}" text-anchor="start">${fday(pts[0].d)}</text><text x="${x(pts.length - 1)}" y="${H - 8}" text-anchor="end">${fday(pts[pts.length - 1].d)}</text>
  </svg><p class="mut" style="font-size:13px;margin:6px 6px 0">Čára = váha první série, číslo = opakování.</p>`;
}

function fx(cls, title, sub) {
  const el = document.createElement('div'); el.id = 'fx'; el.className = cls;
  el.innerHTML = `<canvas></canvas><div class="msg"><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  document.body.appendChild(el);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = $('canvas', el), ctx = cv.getContext('2d'); const dpr = devicePixelRatio || 1; const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const P = Array.from({ length: cls === 'cold' ? 80 : cls === 'heat' ? 44 : 0 }, () => ({ x: Math.random() * W, y: cls === 'cold' ? Math.random() * -H : H + Math.random() * H * .5, r: 1 + Math.random() * 2.6, v: .6 + Math.random() * 1.4, s: Math.random() * 6.28 }));
  let raf; const t0 = performance.now();
  const step = t => {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      if (cls === 'cold') { p.y += p.v; p.x += Math.sin(t / 900 + p.s) * .4; ctx.fillStyle = 'rgba(225,240,255,.85)'; }
      else { p.y -= p.v * 1.3; p.x += Math.sin(t / 500 + p.s) * .6; ctx.fillStyle = `rgba(242,140,78,${Math.max(0, Math.min(.7, p.y / H))})`; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
    }
    if (t - t0 < 1900) raf = requestAnimationFrame(step);
  };
  if (!reduce && P.length) raf = requestAnimationFrame(step);
  setTimeout(() => { cancelAnimationFrame(raf); el.style.transition = 'opacity .35s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 360); }, 1900);
}

function loadMark() {

function rr(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function spacedL(x, t, X, Y, sp) { x.textAlign = 'left'; let cx = X; for (const ch of [...t]) { x.fillText(ch, cx, Y); cx += x.measureText(ch).width + sp; } return cx; }
function fitFont(x, t, weight, size, maxW) { do { x.font = `${weight} ${size}px ${CF}`; size -= 4; } while (x.measureText(t).width > maxW && size > 36); }
function chipsL(x, items, X, Y) {
  x.font = `500 38px ${CF}`; const padX = 34, gap = 18, h = 88; let cx = X;
  items.forEach(t => { const w = x.measureText(t).width + padX * 2; if (cx + w > 1000) return; x.strokeStyle = 'rgba(245,245,247,.85)'; x.lineWidth = 3.5; rr(x, cx, Y, w, h, h / 2); x.stroke(); x.fillStyle = '#F5F5F7'; x.textAlign = 'left'; x.fillText(t, cx + padX, Y + 58); cx += w + gap; });
}
async function shareCard(h, glow, draw, dateTxt) {
  const mk = await loadMark();
  const c = document.createElement('canvas'); c.width = 1080; c.height = h; const x = c.getContext('2d');
  rr(x, 0, 0, 1080, h, 72); const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#242427'); g.addColorStop(1, '#101012'); x.fillStyle = g; x.fill();
  x.save(); rr(x, 0, 0, 1080, h, 72); x.clip();
  const rg = x.createRadialGradient(1000, 40, 10, 1000, 40, 620); rg.addColorStop(0, glow); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0, 0, 1080, h); x.restore();
  x.strokeStyle = 'rgba(255,255,255,.09)'; x.lineWidth = 3; rr(x, 1.5, 1.5, 1077, h - 3, 70.5); x.stroke();
  if (mk) { const lh = 52, lw = lh * (mk.naturalWidth || mk.width) / (mk.naturalHeight || mk.height); x.drawImage(mk, 80, 78, lw, lh); }
  x.fillStyle = '#8E8E93'; x.font = `500 32px ${CF}`; x.textAlign = 'right'; x.fillText(dateTxt || fdate(today()), 1000, 118);
  x.textAlign = 'left'; draw(x); return c;
}

  document.body.appendChild(el);

    const b = ev.target.closest('[data-x]'); if (!b) return;

    try {

}

// ===================== MÍRY · Deník nabírání =====================
const SCALES = []; // pocity zrušeny – stačí hodiny spánku
const MEAS = [['shoulders', 'Ramena', 'nejširší místo přes delty'], ['chest', 'Hrudník', 'přes bradavky, po výdechu'], ['bicepsL', 'Biceps L', 'napnutý, nejširší místo'], ['biceps', 'Biceps P', 'napnutý, nejširší místo'], ['forearm', 'Předloktí', 'nejširší místo, pěst sevřená'], ['waist', 'Pas', 'v úrovni pupku, nezatahovat'], ['thighL', 'Stehno L', 'nejširší místo pod hýždí'], ['thigh', 'Stehno P', 'nejširší místo pod hýždí'], ['calf', 'Lýtko', 'nejširší místo, uvolněně'], ['neck', 'Krk', 'těsně pod ohryzkem']];
const TRAIN = ['Volno', 'Silový', 'Silový + kardio', 'Kardio', 'Thai box', 'Jiné'];
const DMS = 864e5;
const toU = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromU = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const avgOf = a => { const b = a.filter(x => x != null && !isNaN(x)); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null; };
const nf = (v, dec = 1) => v == null || isNaN(v) ? '–' : (Math.abs(v) < Math.pow(10, -dec) / 2 ? 0 : v).toLocaleString('cs-CZ', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const sg = (v, dec) => v == null ? '–' : (v > 0 ? '+' : '') + nf(v, dec);
function BD() { if (!S.body) S.body = { days: {}, meas: {}, settings: {} }; return S.body; }
function bStart() { const b = BD(); if (b.settings.start) return b.settings.start; const k = Object.keys(b.days).filter(k => b.days[k].weight != null).concat(Object.keys(b.meas)).sort(); return k[0] || null; }
const weekNo = (k, st) => Math.floor((toU(k) - toU(st)) / (7 * DMS)) + 1;
// cílové tempo (kg/týden): týden 1–2 adaptace, 3–12: 0,2–0,35, od 13.: 0,115–0,23
function pace(w) { if (w <= 2) return null; if (w <= 12) return [0.2, 0.35]; return [0.115, 0.23]; }
const adhVal = a => a === 'Ano' ? 1 : a === 'Částečně' ? .5 : a === 'Ne' ? 0 : null;
function autoTraining(k) {
  const s = sessionOn(k); const a = actsOn(k);
  const cardio = (s && s.cardio && s.cardio.mode === 'join') || a.some(x => x.type === 'bike');
  if (s && s.end) return cardio ? 'Silový + kardio' : 'Silový';
  if (a.some(x => x.type === 'thai')) return 'Thai box';
  if (cardio) return 'Kardio';
  return null;
}
function bWeeks() {
  const st = bStart(); if (!st) return []; const b = BD(); const W = {};
  for (const [d, v] of Object.entries(b.days)) { const w = weekNo(d, st); if (w < 1) continue; (W[w] = W[w] || { days: [], meas: [] }).days.push({ ...v, date: d }); }
  for (const [d, v] of Object.entries(b.meas)) { const w = weekNo(d, st); if (w < 1) continue; (W[w] = W[w] || { days: [], meas: [] }).meas.push({ ...v, date: d }); }
  return Object.keys(W).map(Number).sort((a, c) => a - c).map(w => {
    const D = W[w].days, M = W[w].meas.sort((a, c) => a.date < c.date ? -1 : 1).pop() || {};
    const ad = D.map(x => adhVal(x.adherence)).filter(x => x != null);
    const r = { w, from: fromU(toU(st) + (w - 1) * 7 * DMS), n: D.filter(x => x.weight != null).length, weight: avgOf(D.map(x => x.weight)), steps: avgOf(D.map(x => x.steps)), sleep: avgOf(D.map(x => x.sleep)), adherence: ad.length ? avgOf(ad) : null, m: M };
    SCALES.forEach(([k]) => r[k] = avgOf(D.map(x => x[k])));
    return r;
  });
}
function weightNear(k) { const t = toU(k); return avgOf(Object.entries(BD().days).filter(([d, v]) => v.weight != null && Math.abs(toU(d) - t) <= 3 * DMS).map(([, v]) => v.weight)); }
function bComp() {
  const H = BD().settings.height || 197;
  return Object.entries(BD().meas).sort((a, c) => a[0] < c[0] ? -1 : 1).map(([date, m]) => {
    const w = weightNear(date); if (w == null) return null;
    let bf = null, src = '';
    if (m.bf != null) { bf = m.bf / 100; src = 'měření'; }
    else if (m.waist != null && m.neck != null && m.waist > m.neck) { bf = (495 / (1.0324 - 0.19077 * Math.log10(m.waist - m.neck) + 0.15456 * Math.log10(H)) - 450) / 100; src = 'odhad'; }
    if (bf == null || bf < .02 || bf > .5) return null;
    return { date, x: toU(date), w, bf, lean: w * (1 - bf), fat: w * bf, muscle: m.muscle ?? null, src };
  }).filter(Boolean);
}
function bVerdict() {
  const full = bWeeks().filter(x => x.weight != null);
  if (full.length < 2) return { ch: null, st: ['idle', 'Málo dat'], w: full.length ? full[full.length - 1].w : null };
  const a = full[full.length - 1], b = full[full.length - 2]; const ch = (a.weight - b.weight) / (a.w - b.w); const t = pace(a.w);
  if (!t) return { ch, st: ['idle', `Týden ${a.w}: adaptace, nehodnotit`], w: a.w };
  if (ch < t[0]) return { ch, st: ['warn', `Pod cílem ${nf(t[0], 2)}–${nf(t[1], 2)}`], w: a.w };
  if (ch > t[1] + .05) return { ch, st: ['bad', `Nad cílem ${nf(t[0], 2)}–${nf(t[1], 2)}`], w: a.w };

function waistDelta() { const M = Object.entries(BD().meas).sort((a, c) => a[0] < c[0] ? -1 : 1).map(([, m]) => m); const f = M.find(m => m.waist != null), l = [...M].reverse().find(m => m.waist != null); return f && l && f !== l ? l.waist - f.waist : null; }
// upozornění: hodnotí jen dokončené týdny se ≥4 váženími
function bAlerts() {
  const out = []; const st = bStart(); if (!st) return out;
  const cur = weekNo(today(), st);
  const W = bWeeks().filter(w => w.w < cur && w.weight != null);
  const ev = [];
  for (let i = 1; i < W.length; i++) { const a = W[i], b = W[i - 1]; const t = pace(a.w); if (!t || a.n < 4 || b.n < 4) continue; const ch = (a.weight - b.weight) / (a.w - b.w); ev.push({ w: a.w, k: ch < t[0] ? 'under' : ch > t[1] + .05 ? 'over' : 'ok', ch, t }); }
  const l2 = ev.slice(-2);
  if (l2.length === 2 && l2.every(e => e.k === 'under')) out.push(['warn', `2 týdny po sobě pod cílovým tempem (${sg(l2[0].ch, 2)} a ${sg(l2[1].ch, 2)} kg). Je čas upravit jídelníček – napiš Claudovi.`]);
  else if (l2.length === 2 && l2.every(e => e.k === 'over')) out.push(['warn', `2 týdny po sobě nad cílovým tempem (${sg(l2[0].ch, 2)} a ${sg(l2[1].ch, 2)} kg). Hrozí zbytečný tuk – zvaž úpravu jídelníčku.`]);
  else if (l2.length && l2[l2.length - 1].k !== 'ok') out.push(['idle', `Týden ${l2[l2.length - 1].w} mimo cílové tempo. Jeden týden nic neznamená, sleduj další.`]);
  const lastW = bWeeks().find(w => w.w === cur - 1);
  if (lastW && lastW.n < 4 && cur > 1) out.push(['idle', `Minulý týden jen ${lastW.n} vážení – hodnocení tempa není spolehlivé (ideálně 5–7).`]);
  const wd = waistDelta(); if (wd != null && wd >= 4) out.push(['bad', `Pas ${sg(wd, 1)} cm od startu. Signál k udržovací fázi.`]);
  const lm = Object.keys(BD().meas).sort().pop();
  if (lm && (toU(today()) - toU(lm)) / DMS >= 7) out.push(['idle', `Poslední míry ${fday(lm)}. Je čas na týdenní měření.`]);
  return out;
}

  bseg: b => { const f = b.dataset.f; let v = b.dataset.v; if (/^\d$/.test(v)) v = +v; bf[f] = bf[f] === v ? null : v; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', String(bf[f]) === x.dataset.v)); },
  'b-sick': b => { const k = b.dataset.k; const d = S.days[k] = S.days[k] || {}; d.sick = !d.sick; save(true); b.classList.toggle('on', d.sick); },
  'b-save-day': () => { const r = readDayForm(); if (!r) return; if (!Object.keys(r.o).length) return toast('Vyplň aspoň jednu hodnotu'); r.o.savedAt = Date.now(); BD().days[r.k] = r.o; save(true); bf = null; render(); toast('Den uložen'); },
  'b-del-day': b => { delete BD().days[b.dataset.k]; save(true); bf = null; render(); toast('Záznam smazán'); },
  'b-save-meas': () => {
    const k = $('#m-date').value || today(); const o = {};
    for (const [f, l] of MEAS) { const v = num($('#m-' + f).value); if (v != null) { if (v < 10 || v > 250) return toast(`Zkontroluj míru: ${l}`); o[f] = v; } }
    const mu = num($('#m-muscle').value), fat = num($('#m-bf').value), bmi = num($('#m-bmi').value);
    if (mu != null) o.muscle = mu; if (fat != null) { if (fat < 2 || fat > 50) return toast('Tuk mimo rozsah 2–50 %'); o.bf = fat; } if (bmi != null) o.bmi = bmi;
    const fe = $('#m-feel').value.trim(); if (fe) o.feel = fe; if (bf.photos) o.photos = bf.photos;
    if (!Object.keys(o).length) return toast('Vyplň aspoň jednu míru');
    o.savedAt = Date.now(); BD().meas[k] = o; save(true); bf = null; render(); toast('Míry uloženy');
  },
  'b-del-meas': b => { delete BD().meas[b.dataset.k]; save(true); bf = null; render(); toast('Míry smazány'); },
  'b-save-set': () => { const s = BD().settings; const st = $('#s-start').value; const h = num($('#s-height').value); if (st) s.start = st; else delete s.start; if (h != null) s.height = h; else delete s.height; save(true); render(); toast('Nastavení uloženo'); },
  'b-open-day': b => { bf = null; go('mery', { t: 'den', d: b.dataset.k }); },
  'b-open-meas': b => { bf = null; go('mery', { t: 'miry', md: b.dataset.k }); },
  'b-copy': async () => { const txt = claudeSummary(); try { await navigator.clipboard.writeText(txt); toast('Zkopírováno – vlož to Claudovi'); } catch (e) { sheet(`<h2>Přehled pro Clauda</h2><p class="mut">Označ text a zkopíruj ho.</p><textarea class="inp" style="min-height:300px;font-size:13px" readonly>${esc(txt)}</textarea>`); } },
});
document.addEventListener('change', e => {
  if (view.n !== 'mery') return;
  if (e.target.id === 'b-date') { bf = null; go('mery', { t: 'den', d: e.target.value || today(), md: view.md }); }
  if (e.target.id === 'm-date') { bf = null; go('mery', { t: 'miry', d: view.d, md: e.target.value || today() }); }

// ===================== REKORDY · ODPOČET · SOUHRN TÝDNE =====================
// rekord = vyšší váha než kdykoli předtím, nebo stejná maximální váha s více opakováními
function bestBefore(exId, s) {
  const ex = exById(exId); let b = null;
  for (const o of finished()) {
    if (o.id === s.id || o.start >= s.start) continue;
    const e = o.entries.find(x => x.exId === exId); if (!e) continue;
    usedSets(e, ex).forEach(st => { if (!hasData(st, ex)) return; const w = num(st.w), r = repsOf(st, ex); if (!b || w > b.w + 1e-9 || (Math.abs(w - b.w) < 1e-9 && r > b.r)) b = { w, r }; });
  }
  return b;
}
function isPR(st, ex, best) { if (!best || !hasData(st, ex)) return false; const w = num(st.w), r = repsOf(st, ex); return w > best.w + 1e-9 || (Math.abs(w - best.w) < 1e-9 && r > best.r); }
function sessionPRs(s) {
  const out = [];
  for (const e of s.entries) {
    const ex = exById(e.exId); if (!ex) continue; const best = bestBefore(e.exId, s); if (!best) continue;
    let top = null; usedSets(e, ex).forEach(st => { if (isPR(st, ex, best)) { const w = num(st.w), r = repsOf(st, ex); if (!top || w > top.w || (w === top.w && r > top.r)) top = { w, r }; } });
    if (top) out.push({ ex, ...top, pw: best.w, pr: best.r });
  }
  return out;
}
const arH = (a, pr) => `<b class="ar ${pr ? 'pr' : a || ''}" data-ar>${pr ? 'PR' : ARROW[a] || ''}</b>`;

// ---------- odpočet před pracovní sérií ----------
const fcd = sec => `${Math.floor(sec / 60)}:${pad(sec % 60)}`;
const cdOf = ex => ex.cd || S.settings.cd || 120;
let actx = null;
function armAudio() { if (S.settings.cdSound === false) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); const o = actx.createOscillator(), g = actx.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.01); } catch (e) { } }
function beep() {
  if (S.settings.cdSound === false || !actx) return;
  try { if (actx.state === 'suspended') actx.resume(); const t = actx.currentTime + .05; [0, .3, .6].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.45, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .24); o.start(t + d); o.stop(t + d + .3); }); } catch (e) { }
}
let cdMode = null;
function cdPaint() {
  let el = $('#cdbar');
  if (!S.cd || view.n !== 'workout') { if (el) { el.remove(); cdMode = null; } return; }
  if (!el) { el = document.createElement('div'); el.id = 'cdbar'; document.body.appendChild(el); cdMode = null; }
  const rem = Math.ceil((S.cd.end - Date.now()) / 1000);
  if (rem <= 0) {
    if (!S.cd.done) { S.cd.done = true; save(); beep(); }
    if (-rem > 120) { S.cd = null; save(); el.remove(); cdMode = null; return; }
    if (cdMode !== 'go') { cdMode = 'go'; el.className = 'cdbar go'; el.innerHTML = `<div class="t"><small>${esc(S.cd.name)}</small><b>Pracovní série – jdi na to</b></div><button class="cx" data-a="cd-stop" aria-label="Hotovo">${ico('check')}</button>`; }
    return;
  }
  if (cdMode !== 'run') { cdMode = 'run'; el.className = 'cdbar'; el.innerHTML = `<div class="pg"></div><div class="t"><small>Pracovní série za · ${esc(S.cd.name)}</small><b data-cd></b></div><button class="ad" data-a="cd-add">+30 s</button><button class="cx" data-a="cd-stop" aria-label="Zrušit odpočet">${ico('x')}</button>`; }
  $('[data-cd]', el).textContent = fcd(rem);
  $('.pg', el).style.width = `${Math.min(100, (1 - rem / S.cd.total) * 100)}%`;
}
setInterval(cdPaint, 400);

// ---------- souhrn týdne (jen na vyžádání z kalendáře) ----------
function weekSheet(monK) {
  const mon = pdate(monK); const ks = [...Array(7)].map((_, i) => dkey(addDays(mon, i)));
  const ses = ks.map(sessionOn).filter(s => s && s.end);
  const mins = ses.reduce((a, s) => a + fmin(s.end - s.start), 0);
  const acts = ks.flatMap(actsOn);
  const prs = ses.flatMap(s => sessionPRs(s));
  const ups = ses.reduce((a, s) => a + stats(s).up, 0);
  const perf = avgOf(ses.map(s => s.perf));
  const bd = BD().days;
  const aw = avgOf(ks.map(k => bd[k]?.weight)), pw = avgOf(ks.map(k => bd[dkey(addDays(pdate(k), -7))]?.weight));
  const ch = aw != null && pw != null ? aw - pw : null;
  const st = bStart(); const t = st ? pace(weekNo(dkey(addDays(mon, 3)), st)) : null;
  const tp = ch == null ? null : !t ? ['idle', 'adaptace'] : ch < t[0] ? ['warn', 'pod cílem'] : ch > t[1] + .05 ? ['bad', 'nad cílem'] : ['good', 'v cílovém tempu'];
  const adh = avgOf(ks.map(k => adhVal(bd[k]?.adherence)));
  const en = avgOf(ks.map(k => bd[k]?.energy)), sl = avgOf(ks.map(k => bd[k]?.sleep));
  const sick = ks.filter(k => S.days[k]?.sick).length;
  const exIds = [...new Set(ses.flatMap(s => s.entries.map(e => e.exId)))];
  const stag = exIds.map(id => ({ ex: exById(id), tr: trendOf(id) })).filter(x => x.ex && x.tr.t.startsWith('stagnace'));
  const ac = {}; acts.forEach(a => { const n = a.type === 'other' ? (a.label || 'Jiné') : ACT_TYPES[a.type]?.name || a.type; ac[n] = (ac[n] || 0) + 1; });
  const goal = S.settings.weekGoal || 4; const sun = addDays(mon, 6);
  const row = (k, v) => `<div class="wrow"><span>${k}</span><b>${v}</b></div>`;
  sheet(`<div class="wkh"><button class="round" style="width:44px;height:44px" data-a="wk" data-k="${dkey(addDays(mon, -7))}" aria-label="Předchozí týden">${ico('back')}</button>
      <div><h2>Týden ${isoWeek(mon)}</h2><p class="mut" style="margin:2px 0 0">${mon.getDate()}. ${mon.getMonth() + 1}. – ${sun.getDate()}. ${sun.getMonth() + 1}.</p></div>
      <button class="round" style="width:44px;height:44px" data-a="wk" data-k="${dkey(addDays(mon, 7))}" aria-label="Další týden" ${dkey(addDays(mon, 7)) > today() ? 'disabled' : ''}>${ico('chev')}</button></div>
    <div class="stat3" style="margin-top:16px;background:var(--card)"><div><span>Tréninky</span><b>${ses.length}/${goal}</b></div><div><span>V gymu</span><b>${kg(Math.round(mins / 6) / 10)}<small style="font-size:13px"> h</small></b></div><div><span>Zlepšení</span><b class="up">${ups}</b></div></div>
    ${prs.length ? `<div class="lbl" style="margin:20px 4px 8px">Rekordy</div><div class="list">${prs.map(p => `<div class="li prli"><span class="ic">${ico('medal')}</span><div class="t"><b>${esc(p.ex.name)}</b><small>${kg(p.pw)} × ${p.pr} → <b>${kg(p.w)} × ${p.r}</b></small></div></div>`).join('')}</div>` : ''}
    <div class="lbl" style="margin:20px 4px 8px">Tělo</div><div class="card wcard">
      ${row('Ø ranní váha', aw == null ? '–' : `${nf(aw, 1)} kg`)}
      ${row('Změna proti minulému týdnu', ch == null ? '–' : `${sg(ch, 2)} kg ${tp ? `<i class="stp ${tp[0]}">${tp[1]}</i>` : ''}`)}
      ${row('Jídelníček dodržen', adh == null ? '–' : Math.round(adh * 100) + ' %')}
      ${row('Ø spánek', sl == null ? '–' : nf(sl, 1) + ' h')}
      ${row('Ø výkon v tréninku', perf == null ? '–' : nf(perf, 1) + ' / 5')}
      ${sick ? row('Nemoc', `${sick} ${sick === 1 ? 'den' : sick < 5 ? 'dny' : 'dní'}`) : ''}
    </div>
    ${Object.keys(ac).length ? `<div class="lbl" style="margin:20px 4px 8px">Aktivity</div><div class="chips">${Object.entries(ac).map(([n, c]) => `<span class="chip">${esc(n)} ${c}×</span>`).join('')}</div>` : ''}
    ${stag.length ? `<div class="lbl" style="margin:20px 4px 8px">Stagnuje</div><div class="chips">${stag.map(x => `<span class="chip down">${esc(x.ex.name)} · ${x.tr.t}</span>`).join('')}</div>` : ''}
    ${ses.length ? `<div class="lbl" style="margin:20px 4px 8px">Tréninky</div><div class="list">${ses.map(s => `<button class="li" data-a="open-sum" data-id="${s.id}"><div class="t"><b>${esc(s.name)}</b><small>${fday(s.date)} · ${fmin(s.end - s.start)} min${s.perf ? ` · výkon ${s.perf}/5` : ''}</small></div><span class="chev">${ico('chev')}</span></button>`).join('')}</div>` : ''}
    <div class="actions"><button class="btn white" data-a="close">Zavřít</button></div>`);
}

Object.assign(A, {
  'cd-start': b => { const s = sesById(view.id); const e = s.entries[+b.closest('.ex').dataset.idx]; const ex = exById(e.exId); const sec = cdOf(ex); S.cd = { end: Date.now() + sec * 1000, total: sec, name: ex.name, done: false }; save(); armAudio(); cdPaint(); },
  'cd-add': () => { if (!S.cd) return; S.cd.end += 30000; S.cd.total += 30; save(); cdPaint(); },
  'cd-stop': () => { S.cd = null; save(); cdPaint(); },
  'e-cd': b => { readExDraft(); exDraft.cd = +b.dataset.v || null; drawExEdit(); },

  perf: b => { const s = sesById(view.id); s.perf = s.perf === +b.dataset.v ? null : +b.dataset.v; $$('[data-a=perf]').forEach(x => x.classList.toggle('on', +x.dataset.v === s.perf)); save(); },
  wk: b => weekSheet(b.dataset.k),
  'week-sum': () => weekSheet(dkey(monday(new Date()))),
});

// ---------- ranní upozornění (web push) ----------
const VAPID_PUB = 'BLw9-Y2wVl1XeeGYVOkouEb6L_Ncb6LDGH4nr0RBHOYy4Q03K_gzTsOlqW6-h1aJB8O27hOBm1Mi8GDtBEPQ-j8';
const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function pushState() {
  if (!isStandalone()) return 'browser';
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  return S.settings.pushSub ? 'on' : 'off';
}
function pushCard() {
  const st = pushState();
  const msg = { browser: 'Upozornění fungují jen v appce spuštěné z ikony na ploše.', unsupported: 'Tady upozornění nejdou. Na iPhonu je potřeba iOS 16.4 nebo novější.', denied: 'Upozornění jsou zakázaná. Povol je v Nastavení iPhonu → Oznámení → Kodad boost.', off: 'Ráno ti appka připomene ranní zápis (váha, spánek, včerejšek).', on: 'Upozornění jsou v tomhle telefonu zapnutá.' }[st];
  return `<section class="sec"><div class="lbl" style="margin:0 6px 10px">Ranní upozornění</div><div class="card" style="display:grid;gap:14px">
    <p style="margin:0;font-size:15px" class="mut">${msg}</p>
    ${st === 'off' ? `<button class="btn white" data-a="push-on">Zapnout upozornění</button>` : ''}
    ${st === 'on' ? `<button class="btn" data-a="push-copy">Zkopírovat kód pro Clauda</button><p class="mut" style="font-size:13px;margin:0">Kód pošli Claudovi do chatu, ten upozornění dokončí.</p>` : ''}
  </div></section>`;
}
async function pushCopy() {
  const txt = JSON.stringify(S.settings.pushSub);
  try { await navigator.clipboard.writeText(txt); toast('Zkopírováno – vlož to Claudovi'); }
  catch (e) { sheet(`<h2>Kód pro Clauda</h2><p class="mut">Označ celý text a zkopíruj ho.</p><textarea class="inp" style="min-height:200px;font-size:12px" readonly>${esc(txt)}</textarea>`); }
}
Object.assign(A, {
  'push-on': async () => {
    try {
      const p = await Notification.requestPermission(); if (p !== 'granted') { toast('Upozornění nepovolena'); return render(); }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
      S.settings.pushSub = sub.toJSON(); save(true); render(); pushCopy();
    } catch (e) { toast('Nepovedlo se: ' + (e.message || e)); }
  },
  'push-copy': () => pushCopy(),
});
(function () { try { const q = new URLSearchParams(location.search); if (q.get('open') === 'den') { history.replaceState(null, '', location.pathname); setTimeout(() => go('mery', { t: 'den', d: today() }), 0); } } catch (e) { } })();

render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
