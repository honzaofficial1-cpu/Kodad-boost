:root{
  --bg:#0A0A0A; --card:#1C1C1E; --card2:#262628; --card3:#323234; --line:#2E2E31;
  --fg:#F5F5F7; --mut:#8E8E93; --dim:#5C5C61;
  --done:#F2F2F2; --done-soft:rgba(242,242,242,.12); --hot:#FF6A2B; --hot-soft:rgba(255,106,43,.14);
  --prog:#35D0C9; --prog-soft:rgba(53,208,201,.15);
  --down:#E5484D; --down-soft:rgba(229,72,77,.15);
  --warn:#F07B2C; --ice:#9ACBF5; --heat:#F7A25C; --sick:#D46A93;
  --white:#FFFFFF; --ink:#0A0A0A;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --r:26px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:16px/1.4 var(--f);letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(118px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--prog);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg);letter-spacing:inherit}
.num,input{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.up-t{text-transform:uppercase;letter-spacing:.02em}
.lbl{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{display:block;color:var(--fg)}
.mark svg{display:block;height:100%;width:auto}

/* header */
.hdr{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding-block:14px 18px}
.hdr .mark{height:26px;justify-self:center}
.hdr h1{justify-self:center;font-size:19px;font-weight:700;letter-spacing:0}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--fg)}
.round:active{background:var(--card2)}
.round.ghost{background:none;border-color:transparent}

/* buttons */
.pill{display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:0 24px;border-radius:999px;font-size:19px;font-weight:700;width:100%}
.pill.white{background:var(--white);color:var(--ink)}
.pill.dark{background:var(--card2);border:1px solid #4A4A4D;color:var(--fg)}
.pill.lime{background:var(--done);color:var(--ink)}
.pill:active{filter:brightness(.92)}
.pill svg.i{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--card2);font-weight:600;font-size:16px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.white{background:var(--white);color:var(--ink)}
.btn.danger{color:var(--down)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.2)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:22px}
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 14px}
.sec-h h2{font-size:26px;font-weight:700}
.sec-h button{color:var(--mut);font-size:17px;display:flex;align-items:center;gap:4px}

/* home plan card */
.plan{padding:26px 24px 24px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
.plan h1{font-size:34px;line-height:1.02;text-transform:uppercase}
.plan .sub{margin-top:8px;font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:10px;flex-wrap:wrap}
.plan .sub b{color:var(--fg);font-weight:700}
.plan .sub i{font-style:normal;color:var(--dim)}
.ringrow{display:flex;align-items:center;gap:22px;margin:24px 0}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700}
.ringrow .side{display:grid;gap:12px;min-width:0}
.mini{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.mini .mr{width:44px;height:44px;flex:none;position:relative}
.mini .mr svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini .mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.ringrow p{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);line-height:1.35}
.plan.live h1{color:var(--done)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:18px}
.wd{display:grid;justify-items:center;gap:10px;color:var(--mut);font-size:15px}
.wd .c{width:42px;height:42px;max-width:100%;border-radius:50%;border:2.5px solid #5A5A5E;display:grid;place-items:center;color:var(--fg)}
.wd .c svg{width:18px;height:18px;stroke-width:2.6}
.wd.done .c{border-color:var(--done);color:var(--done)}
.wd.part .c{border-color:var(--warn);color:var(--warn)}
.wd.sick .c{border-color:var(--sick)}
.wd.act .c{border-color:var(--prog);color:var(--prog)}
.wd.today span{color:var(--fg);font-weight:700}
.wd.today .c{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px #6A6A6E}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:20px;font-size:14px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:9px;height:9px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:18px;padding:18px;border-radius:22px;background:var(--card);text-align:left}
.tile .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.tile b{display:block;font-size:19px;font-weight:700}
.tile small{display:block;color:var(--mut);font-size:14px;margin-top:2px}

/* floating nav */

/* workout */
.timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 18px;width:max-content;padding:12px 34px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}

.th,.tr{display:grid;grid-template-columns:44px 1fr 1fr 74px 52px;align-items:center}

.notep{display:block;width:calc(100% - 32px);margin:12px 16px 18px;min-height:54px;border-radius:28px;border:0;background:var(--card3);padding:15px 22px;font-size:17px;resize:none;line-height:1.4}

.dock{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;
  display:flex;gap:10px;align-items:center;padding:12px;border-radius:34px;background:rgba(40,40,42,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line)}

.dock .add{background:#3A3A3D;flex:1}
.dock .add svg{color:var(--done)}
.dock .fin{flex:1.2;background:var(--done);color:var(--ink)}

/* finish flow */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 8px 0}
.steps i{height:5px;border-radius:3px;background:#2C2C33}

.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:20px 12px;background:var(--card);border-radius:var(--r);margin-top:14px}

.sfix{position:fixed;z-index:26;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto}

/* forms + sheet */

  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}

  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* ===================== v2.9 – vlastní vzhled (pravidla: 1 barva, 2 fonty, žádná záře, méně krabic, šikmý motiv) ===================== */
:root{
  --fd:'BC',"SF Pro Display",system-ui,sans-serif;
  --bg:#0A0A0A; --card:#141416; --card2:#1E1E21; --card3:#2A2A2D; --line:#222225;
  --prog:var(--hot); --done:#F2F2F2; --r:20px;
}
body{background:var(--bg)}
/* typografie: úzký italic na čísla a nadpisy, systémový font na text */
h1,h2,.gcard h1,.plhero h2{font-family:var(--fd);font-style:italic;font-weight:800;letter-spacing:.005em;text-transform:uppercase}
.hdr h1{font-family:var(--fd);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.lbl{font-size:11px;font-weight:600;letter-spacing:.16em}
.num,.big,.stat3 b,.gtime,.ovc .row .v,.extbl .tr span:nth-child(2),.extbl .tr span:nth-child(3){font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums}
/* šikmý motiv */
.slab{display:inline-block;height:6px;width:64px;background:var(--hot);transform:skewX(-24deg);border-radius:1px}
.slab+.slab{width:18px;opacity:.45;margin-left:6px}

/* ---------- domů ---------- */
.hdate{font-family:var(--fd);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:6px 2px 14px}

.gcard::after{display:none}
.gcard .lbl{color:var(--mut)}
.gcard.live .lbl{color:var(--hot)}
.gcard h1{font-size:68px;line-height:.86;margin-top:12px;letter-spacing:0}
.gcard h1::after{content:"";display:block;width:72px;height:7px;margin-top:14px;background:var(--hot);transform:skewX(-24deg);transform-origin:left}
.gsub{font-size:15px;color:#B9B9BE;margin-top:14px}
.gtime{font-size:56px;font-style:italic;font-weight:800;color:var(--hot);margin-top:8px}
.gplay,.gplay.ok{box-shadow:none}
.gplay{width:60px;height:60px;border-radius:18px;transform:skewX(-10deg)}
.gplay svg.i{transform:skewX(10deg)}
.gplay.ok{background:var(--card3);color:var(--fg)}
/* týden: šikmé dílky */
.wk7{gap:5px;margin-top:20px}

.w7.today span{color:var(--hot)}
.w7.today i{box-shadow:inset 0 0 0 2px var(--hot)}
.w7.pl-on i{outline:0;background:#232326;box-shadow:inset 0 -3px 0 var(--hot)}
.w7.today.pl-on i{box-shadow:inset 0 0 0 2px var(--hot)}
.w7.pl-miss i{outline:0;background:#232326;box-shadow:inset 0 -3px 0 rgba(229,72,77,.7)}
.w7 u.on{background:var(--mut)}
.gfoot .mut{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.04em}

/* plán + zmeškaný den: řádky bez krabic */
.plcard{background:none;border-radius:0;padding:16px 2px;margin-top:6px;border-bottom:1px solid var(--line)}
.plring i{font-family:var(--fd);font-style:italic;font-size:16px}

/* dlaždice Míry/Aktivity → dva řádky s velkým číslem vpravo */
.hgrid{display:block;margin-top:0}

.fsi .t{display:flex;flex-direction:column;min-width:0}.fsi .t b{font-weight:500;font-size:15px}.fsi .t small{color:var(--hot);font-size:12px}

.fadd{display:flex;gap:8px;margin-top:16px}.fadd input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg)}
.fsup{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border-radius:18px;border-left:4px solid transparent}
.fsup.warn{border-left-color:var(--hot)}.fsup.crit{border-left-color:var(--down)}
.fsup .t{display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--fg)}.fsup .t b{font-size:17px}.fsup .t small{color:var(--mut);font-size:13px}
.fsr{display:flex;align-items:center;justify-content:space-between;gap:10px}.fsr span{display:flex;flex-direction:column;font-size:14px}.fsr small{color:var(--mut);font-size:12px}.fsr .btn{padding:9px 14px}
.frec{display:flex;flex-direction:column;gap:4px;padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--mut);background:var(--card);border-radius:0 16px 16px 0}
.frec.up,.frec.down,.frec.check,.frec.big{border-left-color:var(--hot)}.frec.ok{border-left-color:var(--done)}
.frec b{font-size:17px}.frec span{color:#C7C7CC;font-size:14px}
.fq{display:flex;flex-direction:column;gap:10px;margin-top:12px}.fq small{color:var(--mut);font-size:13px;display:block;margin-bottom:6px}
.fstat{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px}
.fstat>div{display:flex;flex-direction:column;gap:2px;padding:12px 4px}.fstat>div+div{border-left:1px solid var(--line);padding-left:12px}
.fstat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}.fstat b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:30px;line-height:1}.fstat b small{font-size:13px;color:var(--mut);font-style:normal}.fstat em{font-style:normal;font-size:11px;color:var(--mut)}
.fwr{display:grid;grid-template-columns:1fr auto 110px;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:baseline}.fwr b{font-family:var(--fd);font-weight:700;font-size:18px}.fwr small{color:var(--mut);font-size:12px;text-align:right}.fwr.dim b{color:var(--mut)}
.fsc{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;margin-bottom:8px}.fsc>span{font-size:14px;color:#C7C7CC}
.fstep{display:flex;align-items:center;justify-content:space-between;gap:12px}.fstep>div{text-align:center;display:flex;flex-direction:column}.fstep b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:44px;line-height:1}.fstep small{color:var(--mut);font-size:12px}.fstep .round{font-size:24px;font-weight:700}
.fsteps{margin:10px 0 0;padding-left:20px;font-size:14px;color:#C7C7CC;display:grid;gap:3px}
.fdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.fdays button{padding:12px 0;border-radius:12px;background:var(--card2);font-family:var(--fd);font-weight:700;font-size:16px;text-transform:uppercase}.fdays button.on{background:var(--hot);color:#0A0A0A}
.frem{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.frem::-webkit-scrollbar{display:none}
.frem button{flex:none;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);max-width:240px}
.frem button.crit{border-color:var(--down)}.frem b{font-size:14px}.frem small{font-size:12px;color:var(--mut)}

/* Jídlo = zelená + bílá */
html.food{--hot:#3FCF7A;--hot-soft:rgba(63,207,122,.15)}
html.food nav.tabs button.on{background:#1F3A2A;color:#3FCF7A}
html.food .hdr h1{color:#FFFFFF}
.frow .hic{color:#3FCF7A!important}
.frow{border-left:3px solid #3FCF7A;padding-left:12px!important}
.fjls{display:flex;flex-direction:column;gap:8px}
.fjl{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-radius:16px}
.fjl .t{flex:1;display:flex;align-items:center;gap:12px;text-align:left;color:var(--fg);min-width:0}
.fjl .t span:last-child{display:flex;flex-direction:column;min-width:0}.fjl b{font-size:15px}.fjl small{color:var(--mut);font-size:12px}
.fjl .rd{width:20px;height:20px;border-radius:50%;border:2px solid #4A4B51;flex:none}
.fjl.on{box-shadow:inset 0 0 0 1.5px var(--hot)}.fjl.on .rd{border-color:var(--hot);background:radial-gradient(circle,var(--hot) 45%,transparent 50%)}
.fjcur{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:18px;padding:12px 2px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:left}
.fjcur b{color:var(--hot);font-size:14px}
.fmk{display:flex;flex-direction:column;align-items:flex-end}.fmk em{font-family:var(--f);font-style:normal;font-weight:600;font-size:12px;color:var(--hot);margin-top:2px}
.fsum2{margin-top:22px;padding:16px;background:var(--card);border-radius:20px}
.fsk{display:flex;align-items:baseline;gap:8px;margin:6px 0 12px}.fsk b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:64px;line-height:.85}.fsk span{font-size:16px;color:var(--mut)}
.fmrs{display:flex;flex-direction:column}
.fmr{display:grid;grid-template-columns:96px 1fr 70px 40px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fmr .l{display:flex;flex-direction:column;font-size:15px;font-weight:600}.fmr .l small{font-size:11px;font-weight:500;color:var(--hot)}
.fmr .bar{height:6px;border-radius:3px;background:#26272B;overflow:hidden}.fmr .bar i{display:block;height:100%;background:#8E8E93;border-radius:3px}
.fmr.pro .bar i{background:var(--hot)}
.fmr b{font-family:var(--fd);font-weight:700;font-size:24px;text-align:right}.fmr b small{font-size:13px;color:var(--mut);font-family:var(--f);font-weight:500}
.fmr.pro b{color:var(--hot)}.fmr em{font-style:normal;font-size:12px;color:var(--mut);text-align:right}
.fmnote{margin:8px 0 0;font-size:11px;color:var(--mut)}
.fshi{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:12px;background:var(--line);border-radius:16px;overflow:hidden}
.fshi>div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--card)}.fshi>div.w{grid-column:1/-1}
.fshi span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}.fshi b{font-size:16px}.fshi small{font-size:12px;color:var(--hot)}
.fmk>span{white-space:nowrap}
.swhen .chip{padding:9px 13px;font-size:14px}.swhen .chip.on{background:var(--hot);color:#0B0B0C}
.fsupd .fsi .t small{color:var(--mut)}

.fmeal:has(.feat){grid-template-columns:30px 64px 1fr auto;gap:10px}
.feat{width:28px;height:28px;border-radius:50%;border:2px solid #4A4B51;display:grid;place-items:center;color:#0A0A0A}

.scard h1{font-size:54px;line-height:.86;margin-top:10px}
.scard h1::after{content:"";display:block;width:56px;height:6px;margin-top:12px;background:var(--sc,var(--hot));transform:skewX(-24deg);transform-origin:left}
.scard.food{--sc:#3FCF7A;background:#0E1A12;box-shadow:inset 0 0 0 1px #1C3324}
.scard.food .lbl{color:#3FCF7A}

.wside span,.wgrid span,.wlist span{display:block;font-size:12px;color:var(--mut)}
.wside b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:30px;line-height:1.05}
.wside b small,.wgrid b small{font-size:14px;font-family:inherit;font-style:normal;font-weight:600;color:var(--mut)}

const MON = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];
const MONG = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const fday = k => { const d = pdate(k); return `${DOW[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}.`; };
const fdate = k => { const d = pdate(k); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`; };
const flong = k => { const d = pdate(k); return `${DOWL[d.getDay()]} ${d.getDate()}. ${MONG[d.getMonth()]}`; };
const num = v => { if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : null; };
const kg = n => n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const r2 = n => Math.round(n * 100) / 100;
const thou = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fclock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return `${pad(h)}:${pad(m)}:${pad(s)}`; };
const pl = (n, a, b, c) => `${n} ${n === 1 ? a : n >= 2 && n <= 4 ? b : c}`;

const monday = d => { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const exById = id => S.exercises.find(e => e.id === id);
const adjSets = (sets, n) => { if (!n || n === sets.length) return sets; if (n < sets.length) return sets.slice(0, n); const o = sets.slice(); while (o.length < n) o.push({ ...o[o.length - 1] }); return o; };
const exE = e => { const ex = exById(e.exId); if (!ex || !e.n || e.n === ex.sets.length) return ex; return Object.assign(Object.create(ex), { sets: adjSets(ex.sets, e.n) }); };

// ---------- progression core ----------
function repsOf(set, ex) {
  if (!set) return null;
  if (ex.uni) { const l = num(set.l), r = num(set.r); if (l == null && r == null) return null; if (l == null) return r; if (r == null) return l; return Math.min(l, r); }
  return num(set.reps);
}
const hasData = (set, ex) => !!set && num(set.w) != null && repsOf(set, ex) != null;
function lastBefore(exId, s) {
  const ex = exById(exId);
  for (const o of finished()) {
    if (o.id === s.id || o.start >= s.start) continue;
    const e = o.entries.find(x => x.exId === exId);
    if (e && e.sets.some(st => hasData(st, ex))) return { s: o, e };
  }
  return null;
}
const topHit = (reps, cfg) => S.settings.rule === 'reach' ? reps >= cfg.max : reps > cfg.max;
function target(ex, i, last) {
  const cfg = ex.sets[i]; const ls = last && last.e.sets[i];
  if (!cfg || !ls || !hasData(ls, ex)) return { kind: 'new', w: null };
  const r = repsOf(ls, ex), w = num(ls.w);
  if (topHit(r, cfg)) return { kind: 'up', w: r2(w + (ex.inc || 0)), lastW: w, lastR: r };
  return { kind: 'same', w, lastW: w, lastR: r, goal: r + 1 };
}
function cmpVals(w, r, pw, pr) { if (w == null || r == null) return null; if (pw == null || pr == null) return 'new'; if (w > pw + 1e-9) return 'up'; if (w < pw - 1e-9) return 'down'; return r > pr ? 'up' : r < pr ? 'down' : 'eq'; }
function cmp(cur, prev, ex) { if (!hasData(cur, ex)) return null; if (!prev || !hasData(prev, ex)) return 'new'; return cmpVals(num(cur.w), repsOf(cur, ex), num(prev.w), repsOf(prev, ex)); }
function cmpSide(cur, prev, ex, f) { const w = num(cur?.w), r = num(cur?.[f]); if (w == null || r == null) return null; if (!prev || num(prev.w) == null) return 'new'; const pr = num(prev[f]) ?? repsOf(prev, ex); return cmpVals(w, r, num(prev.w), pr); }
const ARROW = { up: '↑', down: '↓', eq: '', new: '' };
const setTxt = (st, ex) => !hasData(st, ex) ? '–' : ex.uni ? `${kg(num(st.w))} × ${st.l ?? '–'}/${st.r ?? '–'}` : `${kg(num(st.w))} × ${st.reps}`;
const usedSets = (e, ex) => e.sets.slice(0, ex.sets.length);
function stats(s) {
  let sets = 0, up = 0, down = 0, vol = 0;
  for (const e of s.entries) {
    const ex = exE(e); if (!ex) continue;
    const prev = lastBefore(e.exId, s);
    usedSets(e, ex).forEach((st, i) => {
      if (!hasData(st, ex)) return; sets++;
      vol += num(st.w) * (ex.uni ? (num(st.l) || 0) + (num(st.r) || 0) : num(st.reps));
      const c = cmp(st, prev && prev.e.sets[i], ex); if (c === 'up') up++; if (c === 'down') down++;
    });
  }
  return { sets, up, down, vol, ex: s.entries.filter(e => { const ex = exE(e); return ex && e.sets.some(st => hasData(st, ex)); }).length };
}
function progItems(s) {
  const out = [];
  for (const e of s.entries) {
    const ex = exE(e); if (!ex) continue; const prev = lastBefore(e.exId, s); if (!prev) continue;
    const c = [];
    usedSets(e, ex).forEach((st, i) => {
      const p = prev.e.sets[i]; if (!hasData(st, ex) || !hasData(p, ex)) return;
      const w = num(st.w), pw = num(p.w), r = repsOf(st, ex), pr = repsOf(p, ex);
      if (w > pw + 1e-9) c.push({ k: 'kg', d: `+${kg(r2(w - pw))} kg`, from: `${kg(pw)} kg`, to: `${kg(w)} kg`, sc: 3 - i * .01 });
      else if (Math.abs(w - pw) < 1e-9 && r > pr) c.push({ k: 'up', d: `+${r - pr} opak.`, from: `${pr} opak.`, to: `${r} opak.`, sc: 2 - i * .01 });
      else if (w < pw - 1e-9) c.push({ k: 'down', d: `−${kg(r2(pw - w))} kg`, from: `${kg(pw)} kg`, to: `${kg(w)} kg`, sc: 1 - i * .01 });
      else if (r < pr) c.push({ k: 'down', d: `−${pr - r} opak.`, from: `${pr} opak.`, to: `${r} opak.`, sc: 1 - i * .01 });
    });
    if (c.length) { c.sort((a, b) => b.sc - a.sc); out.push({ ex, ...c[0] }); }
  }
  return out.sort((a, b) => b.sc - a.sc);
}
function nextTemplate(after) {
  if (!S.templates.length) return null;
  if (!after) { const dw = new Date().getDay(); const td = S.templates.find(t => t.dow === dw); if (td && !sessionOn(today())) return td; }
  const ref = after || finished().find(s => s.tid && tplById(s.tid))?.tid;
  if (!ref) return S.templates[0];
  const i = S.templates.findIndex(t => t.id === ref);
  return S.templates[(i + 1) % S.templates.length];
}

function weekCount(mon) { let c = 0; for (let i = 0; i < 7; i++) { const s = sessionOn(dkey(addDays(mon, i))); if (s && s.end) c++; } return c; }

}

function newSession(name, tid) {
  const s = { id: uid(), date: today(), tid: tid || null, name, start: Date.now(), end: null, entries: [], feel: null, perf: null, note: '', cardio: null, stretch: false, open: 0 };
  S.sessions.push(s); S.active = s.id; return s;
}
function startSession(tid) {
  const tp = tplById(tid); if (!tp) return;
  const s = newSession(tp.name, tid); tp.ex.forEach(id => addEntry(s, id, tp.n && tp.n[id]));
  save(true); closeSheet(); go('workout', { id: s.id });
}
function addEntry(s, exId, n) {
  const base = exById(exId); if (!base) return;
  const e = { exId, n: n && n !== base.sets.length ? n : undefined, sets: [], note: '' }; const ex = exE(e);
  const last = lastBefore(exId, s);
  e.sets = ex.sets.map((c, i) => ({ w: target(ex, i, last).w, reps: null, l: null, r: null })); s.entries.push(e);
}

// ===================== STATISTICS =====================
function exHistory(exId) {
  const ex = exById(exId); const out = [];
  for (const s of [...finished()].reverse()) { const e = s.entries.find(x => x.exId === exId); if (e && e.sets.some(st => hasData(st, ex))) out.push({ s, e }); }
  return out;
}
function trendOf(exId) {
  const ex = exById(exId); const h = exHistory(exId);
  if (h.length < 2) return { k: 'na', t: h.length ? '1 záznam' : 'bez dat', n: h.length };
  let stag = 0; for (let i = h.length - 1; i > 0; i--) { if (cmp(h[i].e.sets[0], h[i - 1].e.sets[0], ex) === 'up') break; stag++; }
  if (stag >= 3) return { k: 'down', t: `stagnace ${stag}×`, n: h.length };
  const l = h.slice(-4); let u = 0, d = 0;
  for (let i = 1; i < l.length; i++) { const c = cmp(l[i].e.sets[0], l[i - 1].e.sets[0], ex); if (c === 'up') u++; if (c === 'down') d++; }
  return u > d ? { k: 'up', t: 'roste', n: h.length } : d > u ? { k: 'down', t: 'klesá', n: h.length } : { k: 'flat', t: 'drží', n: h.length };
}
function vProg() {
  const rows = S.exercises.filter(ex => exHistory(ex.id).length).map(ex => ({ ex, tr: trendOf(ex.id) }))
    .sort((a, b) => ({ down: 0, flat: 1, up: 2, na: 3 }[a.tr.k] - { down: 0, flat: 1, up: 2, na: 3 }[b.tr.k]));
  const cnt = k => rows.filter(r => r.tr.k === k).length;
  const fs = finished(); const tot = fs.length; const totMin = fs.reduce((a, s) => a + fmin(s.end - s.start), 0);
  const chip = { up: 'prog', flat: '', down: 'down', na: '' };
  return `<div class="wrap">
    ${hdr(backBtn('gym'), '<h1>Progres cviků</h1>', '<span></span>')}
    <div class="stat3"><div>${ico('arm')}<span>Tréninků</span><b>${tot}</b></div><div>${ico('timer')}<span>Průměr</span><b>${tot ? Math.round(totMin / tot) : 0}<small style="font-size:14px"> min</small></b></div><div>${ico('bolt')}<span>Celkem hodin</span><b>${kg(Math.round(totMin / 6) / 10)}</b></div></div>
    ${rows.length ? `<section class="sec"><div class="sec-h"><h2>Cviky</h2></div>
      <div class="stat3"><div><span>Roste</span><b class="up">${cnt('up')}</b></div><div><span>Drží</span><b>${cnt('flat')}</b></div><div><span>Pozor</span><b class="down">${cnt('down')}</b></div></div>
      <p class="mut" style="font-size:14px;margin:12px 4px">Hodnotí se první pracovní série. Stagnace = 3 tréninky po sobě bez zlepšení.</p>
      <div class="list">${rows.map(({ ex, tr }) => `<button class="li" data-a="prog-ex" data-id="${ex.id}"><div class="t"><b>${esc(ex.name)}</b><small>${tr.n} tréninků · ${esc(ex.muscle)}</small></div><span class="chip ${chip[tr.k]}">${tr.t}</span></button>`).join('')}</div></section>`
      : `<section class="sec"><div class="empty"><b>Zatím žádná data</b><span>Po prvních trénincích tu uvidíš u každého cviku, jestli roste, drží, nebo stagnuje.</span></div></section>`}
  </div>${tabs()}`;
}
function bestOf(h, ex) { let b = null; h.forEach(({ s, e }) => usedSets(e, ex).forEach(st => { if (!hasData(st, ex)) return; const w = num(st.w), r = repsOf(st, ex); if (!b || w > b.w || (w === b.w && r > b.r)) b = { w, r, sid: s.id }; })); return b; }
function vProgEx() {
  const ex = exById(view.id); if (!ex) return vProg();
  const h = exHistory(ex.id); const best = bestOf(h, ex);
  const fw = h.length ? num(h[0].e.sets[0]?.w) : null, lw = h.length ? num(h[h.length - 1].e.sets[0]?.w) : null; const dW = fw != null && lw != null && h.length > 1 ? r2(lw - fw) : null;
  const totalSets = h.reduce((a, { e }) => a + usedSets(e, ex).filter(st => hasData(st, ex)).length, 0);
  const tr = trendOf(ex.id);
  return `<div class="wrap">
    ${hdr(`<button class="round" data-a="back-from-stats" aria-label="Zpět">${ico('back')}</button>`, `<h1 style="font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ex.name)}</h1>`, `<button class="round" data-a="ex-edit" data-id="${ex.id}" aria-label="Upravit cvik">${ico('more')}</button>`)}
    <div class="lbl" style="margin:0 6px 12px">Statistiky cviku ${tr.k !== 'na' ? `<span class="chip ${tr.k === 'up' ? 'prog' : tr.k === 'down' ? 'down' : ''}" style="margin-left:8px;letter-spacing:0;text-transform:none">${tr.t}</span>` : ''}</div>
    <div class="stat3"><div>${ico('weight')}<span>Nejlepší váha</span><b>${best ? kg(best.w) + ' kg' : '–'}</b></div><div>${ico('up')}<span>Od začátku</span><b class="${dW > 0 ? 'up' : ''}">${dW == null ? '–' : (dW > 0 ? '+' : '') + kg(dW) + ' kg'}</b></div><div>${ico('arm')}<span>Tréninků</span><b>${h.length}</b></div></div>
    <div class="card" style="margin-top:14px;padding:18px 14px">${chartSVG(h, ex)}</div>
    <div class="actions"><button class="btn block" data-a="ex-info" data-id="${ex.id}">${ico('info')} Info o cviku</button></div>
    <div class="lbl" style="margin:26px 6px 0">Historie cviku</div>
    ${[...h].reverse().map(({ s, e }) => `<div class="extbl ${best && best.sid === s.id ? 'best' : ''}"><div class="eh"><div class="t"><b>${fdate(s.date)}</b><small>${esc(s.name)}</small></div>${best && best.sid === s.id ? `<span class="badge-best">${ico('medal')}Nejlepší</span>` : ''}</div>
      <div class="th"><span>#</span><span>Kg</span><span>Opak.</span><span>Intenzita</span></div>
      ${usedSets(e, ex).map((st, i) => hasData(st, ex) ? `<div class="tr"><span>${i + 1}</span><span>${kg(num(st.w))}</span><span>${ex.uni ? `${st.l ?? '–'}/${st.r ?? '–'}` : st.reps}</span><span>${ex.sets[i]?.fail ? '<span class="fbadge">F</span>' : `${ex.sets[i]?.min ?? ''}–${ex.sets[i]?.max ?? ''}`}</span></div>` : '').join('')}
      ${e.note ? `<p class="mut" style="margin:0;padding:4px 20px 16px;font-size:14px">${esc(e.note)}</p>` : ''}</div>`).join('') || '<p class="mut" style="margin:12px 6px">Zatím bez záznamů.</p>'}
  </div>${tabs()}`;
}
function chartSVG(h, ex) {
  const pts = h.slice(-14).map(({ s, e }) => ({ d: s.date, w: num(e.sets[0]?.w), r: repsOf(e.sets[0], ex) })).filter(p => p.w != null);
  if (pts.length < 2) return '<p class="mut" style="margin:6px">Graf se ukáže po dvou trénincích.</p>';
  const W = 340, H = 210, L = 38, R = 14, T = 22, B = 30;
  let mn = Math.min(...pts.map(p => p.w)), mx = Math.max(...pts.map(p => p.w));
  const span = Math.max(mx - mn, 4); const mid = (mn + mx) / 2; mn = mid - span * .75; mx = mid + span * .75;
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find(s => (mx - mn) / s <= 6) || 100;
  const ticks = []; for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) ticks.push(r2(v));
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj váhy první série">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2E31"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${kg(v)}</text>`).join('')}
    <line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#3A3A3D"/>
    <path d="${line}" fill="none" stroke="var(--prog)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? 'var(--prog)' : '#1C1C1E'}" stroke="var(--prog)" stroke-width="2"/><text x="${x(i)}" y="${y(p.w) - 10}" text-anchor="middle" style="fill:#F5F5F7;font-weight:600">${p.r}</text>`).join('')}
    <text x="${x(0)}" y="${H - 8}" text-anchor="start">${fday(pts[0].d)}</text><text x="${x(pts.length - 1)}" y="${H - 8}" text-anchor="end">${fday(pts[pts.length - 1].d)}</text>
  </svg><p class="mut" style="font-size:13px;margin:6px 6px 0">Čára = váha první série, číslo = opakování.</p>`;
}

}

  else { big = a.min ? String(a.min) : '✓'; unit = a.min ? 'min' : ''; if (a.kind) sub.push(a.kind); if (a.bpm) sub.push(`${a.bpm} bpm`); }
  if (a.note) sub.push(a.note);
  const title = (a.type === 'other' && a.label ? a.label : t.name).toUpperCase();
  const multi = a.type === 'sauna' && sub.length > 1 + (a.note ? 1 : 0);
  const c = await miniCard(multi ? 452 + sub.length * 50 : 500, key, (x, col, X) => {
    if (a.type === 'cold') { x.fillStyle = 'rgba(225,240,255,.35)'; for (let i = 0; i < 30; i++) { const px = 420 + (i * 197) % 620, py = 40 + (i * 131) % 420; x.beginPath(); x.arc(px, py, 1.5 + (i % 3), 0, 6.28); x.fill(); } }
    x.fillStyle = col; x.font = `700 30px ${CF}`; spacedL(x, clip(x, title, 480), X, 150, 7);
    bigNum(x, big, unit, X - 4, 300, 170);
    if (multi) { sub.forEach((t, i) => { x.fillStyle = i < sub.length - (a.note ? 1 : 0) ? '#C7C7CC' : '#8E8E93'; x.font = `500 34px ${CF}`; x.fillText(clip(x, t, 600), X, 372 + i * 50); }); }
    else if (sub.length) { x.fillStyle = '#C7C7CC'; x.font = `500 36px ${CF}`; x.fillText(clip(x, sub.join('  ·  '), 600), X, 372); }
  }, fdate(a.date));
  showShot(c, `${t.name}-${a.date}.png`);
}

function showShot(canvas, name) {
  const el = document.createElement('div'); el.id = 'shot';
  el.innerHTML = `<img src="${canvas.toDataURL('image/png')}" alt="Náhled pro story"><p>Klepni na „Uložit / sdílet“ → „Uložit obrázek“. Případně podrž prst na obrázku → „Přidat do Fotek“.</p><div class="bottom-acts"><button class="pill white" data-x="share">${ico('share')} Uložit / sdílet</button><button class="pill dark" data-x="close">Zavřít</button></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'close') return el.remove();
    try {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const file = new File([blob], name.replace(/[\\/:*?"<>|]/g, ''), { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] }); else toast('Podrž prst na obrázku a ulož ho');
    } catch (e) { if (e.name !== 'AbortError') toast('Podrž prst na obrázku a ulož ho'); }
  });
}

  if (!S.whoop || !s || !s.end) return null; let best = null, bo = 0;
  Object.values(S.whoop.wo).forEach(x => { const o = Math.min(x.end, s.end) - Math.max(x.start, s.start); if (o > bo) { bo = o; best = x; } });
  return best && bo > 10 * 60000 ? best : null;

function weekAvg(mon) { const ks = [...Array(7)].map((_, i) => dkey(addDays(pdate(mon), i))); const ws = ks.map(k => BD().days[k]?.weight).filter(v => v != null); return { n: ws.length, avg: ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : null }; }
function evalData() {

  const nowMon = dkey(monday(new Date())); const weeks = [];
  for (let m = st; m < nowMon; m = dkey(addDays(pdate(m), 7))) { const a = weekAvg(m); const x = f.weeks[m] || {}; weeks.push({ mon: m, ...a, exc: !!x.exc, excWhy: x.excWhy || '', valid: a.n >= 5 && !x.exc }); }
  const V = weeks.filter(w => w.valid); const evals = [];
  for (let i = 2; i < V.length; i += 2) { const cur = V[i], prev = V[i - 2]; const ch = cur.avg - prev.avg; const lo = cur.avg * .003, hi = cur.avg * .005; evals.push({ mon: cur.mon, from: prev.mon, ch, lo, hi, z: ch < lo ? 'pod' : ch > hi ? 'nad' : 'v' }); }
  // pas
  const M = Object.entries(BD().meas).filter(([, m]) => m.waist != null).sort((a, b) => a[0] < b[0] ? -1 : 1);
  let w4 = null, wAll = null; if (M.length >= 2) { const [lk, lm] = M[M.length - 1]; wAll = lm.waist - M[0][1].waist; const ref = [...M].reverse().find(([k]) => toU(k) <= toU(lk) - 27 * DMS); if (ref) w4 = lm.waist - ref[1].waist; }
  return { st, weeks, evals, w4, wAll, waist: M.length ? M[M.length - 1][1].waist : null };
}
function recommend(E) {
  const f = F(); if (!E) return { t: 'Málo dat', d: 'Zatím není z čeho hodnotit. Važ se denně ráno.', k: 'idle' };

  const weeksSince = Math.floor((toU(today()) - toU(E.st)) / (7 * DMS)); const lastBig = f.reviewAt ? Math.floor((toU(today()) - toU(f.reviewAt)) / (7 * DMS)) : weeksSince;
  if (lastBig >= 12 || (E.wAll != null && E.wAll >= 4)) out.push({ t: 'Čas na velké přehodnocení jídelníčku', d: 'Projdi fotky, váhu, pas a výkon. Není to automatický konec nabírání.', k: 'big', act: 'f-bigdone' });
  if (!L) { out.push({ t: 'Málo dat', d: 'Hodnotí se po 2 týdnech s aspoň 5 váženími. Týden s výjimkou se nepočítá.', k: 'idle' }); return out; }

  else if (P && L.z === 'nad' && P.z === 'nad') out.push({ t: 'Zvaž −1 až 2 kroky', d: 'Dvě hodnocení po sobě nad pásmem.', k: 'down', steps: [-1, -2] });
